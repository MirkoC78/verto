/* Layout: una colonna centrale da app (max 600px), barra in alto, schede in basso; gli esercizi occupano lo schermo con la barra azioni ancorata al fondo.
   Colori dai pigmenti romani: marmo, caeruleum (blu egizio), verderame, minio, ocra, porpora. */
:root {
  --bg: #EEF0EF;
  --surface: #FFFFFF;
  --surface-2: #F5F6F5;
  --ink: #17202D;
  --muted: #5A6372;
  --line: #D8DCE2;
  --line-strong: #BFC6D0;
  --accent: #2347B5;
  --accent-deep: #18338A;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E8FA;
  --ok: #157A5A;
  --ok-deep: #0F5C43;
  --ok-soft: #DCF1E8;
  --err: #BF3826;
  --err-deep: #92281A;
  --err-soft: #FBE2DD;
  --gold: #B97F0E;
  --gold-soft: #FAEED3;
  --g-nom: #2347B5;
  --g-ver: #A6482C;
  --g-pro: #7A3E8E;
  --g-sin: #A87D16;
  --shadow: 0 1px 2px rgba(23, 32, 45, .06), 0 4px 16px rgba(23, 32, 45, .06);
  --f-display: 'Marcellus', 'Trajan Pro', 'Cinzel', Georgia, serif;
  --f-latin: 'Gentium Book Plus', 'Gentium Plus', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --f-ui: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131D; --surface: #161D2A; --surface-2: #1B2332; --ink: #E7EAF0; --muted: #9AA3B4; --line: #273042; --line-strong: #364158;
    --accent: #7E9BFF; --accent-deep: #5A78E0; --accent-ink: #0B1020; --accent-soft: #1D2948;
    --ok: #3CC499; --ok-deep: #2A9C78; --ok-soft: #123329; --err: #FF7D6B; --err-deep: #D9594A; --err-soft: #3B1C18;
    --gold: #F0B445; --gold-soft: #3A2D12; --g-nom: #7E9BFF; --g-ver: #EE8A66; --g-pro: #C68BDA; --g-sin: #E2B84E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131D; --surface: #161D2A; --surface-2: #1B2332; --ink: #E7EAF0; --muted: #9AA3B4; --line: #273042; --line-strong: #364158;
  --accent: #7E9BFF; --accent-deep: #5A78E0; --accent-ink: #0B1020; --accent-soft: #1D2948;
  --ok: #3CC499; --ok-deep: #2A9C78; --ok-soft: #123329; --err: #FF7D6B; --err-deep: #D9594A; --err-soft: #3B1C18;
  --gold: #F0B445; --gold-soft: #3A2D12; --g-nom: #7E9BFF; --g-ver: #EE8A66; --g-pro: #C68BDA; --g-sin: #E2B84E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.la { font-family: var(--f-latin); font-style: italic; }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.app { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 10px; padding-block: 12px 10px;
}
.brand { display: flex; align-items: center; gap: 9px; margin-right: auto; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.brand-mark { width: 14px; height: 14px; background: var(--accent); transform: rotate(45deg); border-radius: 2px; box-shadow: 4px -4px 0 -1px var(--g-ver); }
.brand-name { font-family: var(--f-display); font-size: 22px; letter-spacing: .2em; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 17px; height: 17px; }
.chip.streak { color: var(--g-ver); }
.chip.streak.cold { color: var(--muted); }
.chip.xp { color: var(--gold); }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 500; letter-spacing: .03em; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] .nav-ico { background: var(--accent-soft); }
.nav-ico { padding: 3px 14px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }

/* ---------- Tipografia di sezione ---------- */
.eyebrow { font-family: var(--f-display); letter-spacing: .16em; font-size: 13px; color: var(--muted); text-transform: uppercase; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
h2 { font-size: 19px; font-weight: 600; line-height: 1.3; }
h3 { font-size: 16px; font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.section { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

/* ---------- Pulsanti ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: var(--r);
  border: 0; font-weight: 600; font-size: 16px; letter-spacing: .01em; background: var(--accent); color: var(--accent-ink);
  box-shadow: inset 0 -4px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s, background .2s;
}
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--accent-deep); }
.btn[disabled] { background: var(--line); color: var(--muted); box-shadow: inset 0 -4px 0 var(--line-strong); cursor: default; transform: none; }
.btn.block { width: 100%; }
.btn.ok { background: var(--ok); box-shadow: inset 0 -4px 0 var(--ok-deep); color: #fff; }
.btn.err { background: var(--err); box-shadow: inset 0 -4px 0 var(--err-deep); color: #fff; }
:root[data-theme="dark"] .btn.ok, :root[data-theme="dark"] .btn.err { color: #0B1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok, :root:not([data-theme="light"]) .btn.err { color: #0B1020; } }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line-strong); box-shadow: inset 0 -3px 0 var(--line); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn svg { width: 19px; height: 19px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 14px; }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 24px; height: 24px; }

/* ---------- Home ---------- */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 6px; }
.hello h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .02em; }
.rank-pill { font-size: 13px; color: var(--muted); }
.rank-pill b { color: var(--ink); font-family: var(--f-display); font-weight: 400; letter-spacing: .06em; font-size: 15px; }

.today { margin-top: 16px; background: var(--surface); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 78px; height: 78px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .ring-txt { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; font-weight: 700; font-size: 17px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .ring-txt small { display: block; font-size: 9.5px; font-weight: 500; color: var(--muted); margin-top: 3px; letter-spacing: .04em; }
.today-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.today-body p { margin: 0; color: var(--muted); font-size: 14px; }
.today-body h2 { font-size: 18px; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode {
  position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; min-height: 104px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 -3px 0 var(--line); transition: transform .08s;
}
.mode:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--line); }
.mode-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.mode-ico svg { width: 20px; height: 20px; }
.mode b { font-size: 15px; font-weight: 600; }
.mode span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.mode .badge-n { position: absolute; top: 12px; right: 12px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--err); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.mode.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 0; gap: 12px; }
.mode.wide > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mode.ai .mode-ico { background: var(--gold-soft); color: var(--gold); }
.mode[aria-disabled="true"] { opacity: .65; }

.sententia { background: var(--surface); border-radius: 18px; padding: 20px 18px 16px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.sententia::after { content: ""; position: absolute; inset: auto -30px -30px auto; width: 120px; height: 120px; border-radius: 50%; border: 18px solid var(--accent-soft); opacity: .7; }
.sententia .quote { font-family: var(--f-display); font-size: 25px; line-height: 1.25; letter-spacing: .03em; margin: 6px 0 8px; position: relative; z-index: 1; }
.sententia .tr { margin: 0; font-size: 15px; position: relative; z-index: 1; }
.sententia .src { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); position: relative; z-index: 1; }
.sententia details { margin-top: 10px; position: relative; z-index: 1; font-size: 14px; }
.sententia summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13.5px; }

/* Mosaico degli argomenti */
.mosaic { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 8px; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); }
.tess {
  position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 6px; border: 0; padding: 0; overflow: hidden; background: var(--surface-2);
  display: grid; place-items: end start; color: var(--ink);
}
.tess .fill { position: absolute; inset: 0; background: var(--tc); opacity: var(--m, .12); transition: opacity .4s; }
.tess .lbl { position: relative; font-size: 9.5px; font-weight: 600; line-height: 1.1; padding: 4px; text-align: left; letter-spacing: 0; overflow-wrap: anywhere; hyphens: auto; }
.tess.hi .lbl { color: #fff; }
.tess.off { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--bg) 6px 12px); }
.tess.off .fill { opacity: 0; }
.tess.off .lbl { color: var(--muted); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.g-nom { --tc: var(--g-nom); } .g-ver { --tc: var(--g-ver); } .g-pro { --tc: var(--g-pro); } .g-sin { --tc: var(--g-sin); }

/* ---------- Liste e schede ---------- */
.card { background: var(--surface); border-radius: 16px; border: 1px solid var(--line); padding: 16px; }
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; min-height: 56px; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .grow b { font-weight: 600; font-size: 15px; }
.row .grow span { font-size: 12.5px; color: var(--muted); }
.row .chev { color: var(--line-strong); width: 18px; height: 18px; flex: none; }
.dot { width: 12px; height: 12px; border-radius: 4px; background: var(--tc); flex: none; transform: rotate(45deg); }
.mini-ring { width: 34px; height: 34px; flex: none; position: relative; }
.mini-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.mini-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.tag.on { background: var(--accent-soft); color: var(--accent); }
.tag.new { background: var(--gold-soft); color: var(--gold); }

/* ---------- Teoria ---------- */
.theory { display: flex; flex-direction: column; gap: 14px; }
.theory p { margin: 0; max-width: 65ch; }
.theory ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; font-size: 12px; letter-spacing: .03em; color: var(--muted); background: var(--surface-2); padding: 8px 10px; white-space: nowrap; }
.tbl td { padding: 7px 10px; border-top: 1px solid var(--line); font-family: var(--f-latin); font-size: 16px; white-space: nowrap; }
.tbl td:first-child { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tbl-cap { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.callout { border-radius: 14px; padding: 13px 14px; display: flex; gap: 10px; font-size: 14.5px; }
.callout svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.callout.tip { background: var(--ok-soft); }
.callout.tip svg { color: var(--ok); }
.callout.trap { background: var(--err-soft); }
.callout.trap svg { color: var(--err); }
.callout ul { padding-left: 18px; }
.ex { display: flex; flex-direction: column; gap: 6px; }
.ex-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.ex-row .la { font-size: 18px; font-style: normal; }
.ex-row .it { font-size: 14px; color: var(--muted); }
.method { counter-reset: m; display: flex; flex-direction: column; gap: 8px; }
.method li { list-style: none; display: grid; grid-template-columns: 30px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.method li::before { counter-increment: m; content: counter(m, upper-roman); font-family: var(--f-display); color: var(--accent); font-size: 16px; text-align: center; padding-top: 1px; }
.method b { display: block; font-weight: 600; }
.method span { font-size: 14px; color: var(--muted); }
.ask { display: flex; flex-direction: column; gap: 8px; }
.ask textarea { width: 100%; min-height: 70px; resize: vertical; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); padding: 10px 12px; font-size: 16px; }
.ai-out { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }
.ai-out p { margin: 0 0 8px; }
.ai-out p:last-child { margin-bottom: 0; }
.ai-out ul { margin: 0 0 8px; padding-left: 18px; }

/* ---------- Verba ---------- */
.flash { perspective: 1000px; }
.flash-card {
  width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); padding: 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px;
}
.flash-card .lemma { font-family: var(--f-latin); font-size: 30px; line-height: 1.2; }
.flash-card .cls { font-size: 13px; color: var(--muted); }
.flash-card .mean { font-size: 22px; font-weight: 600; }
.flash-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; text-align: center; }
.box b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.box span { font-size: 11px; color: var(--muted); }
.lookup { display: flex; gap: 8px; }
.input { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); padding: 0 14px; font-size: 16px; }
.input.latin { font-family: var(--f-latin); font-size: 19px; }
.analysis { display: flex; flex-direction: column; gap: 8px; }
.an-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.an-item .an-lemma { font-family: var(--f-latin); font-size: 17px; }
.an-item .an-mean { font-size: 13px; color: var(--muted); }
.an-item ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.wk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.wk-link { display: inline-block; margin-top: 8px; font-size: 13.5px; font-weight: 600; color: var(--accent); text-decoration: none; }
.wk-link::after { content: ' ↗'; }
#wkOut { display: flex; flex-direction: column; gap: 8px; }

/* ---------- Ego ---------- */
.rank-card { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.rank-card .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.rank-card .rank-name { font-family: var(--f-display); font-size: 30px; letter-spacing: .06em; line-height: 1.1; }
.rank-card .rank-it { font-size: 13px; opacity: .75; }
.cursus { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.cursus i { height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--bg) 25%, transparent); }
.cursus i.done { background: var(--gold); }
.bar { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 22%, transparent); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12.5px; color: var(--muted); }
.week { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 6px; }
.week svg { width: 100%; height: auto; display: block; }
.coins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.coin { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: none; border: 0; padding: 4px 0; }
.coin .disc {
  width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 17px; letter-spacing: .04em;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--gold) 55%, #fff) 0, var(--gold) 55%, color-mix(in srgb, var(--gold) 70%, #000) 100%);
  color: color-mix(in srgb, var(--gold) 35%, #000); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--gold) 80%, #000), inset 0 0 0 6px color-mix(in srgb, var(--gold) 70%, #fff);
}
.coin.locked .disc { background: var(--surface-2); color: var(--line-strong); box-shadow: inset 0 0 0 3px var(--line), inset 0 0 0 6px var(--surface); }
.coin small { font-size: 11px; line-height: 1.25; color: var(--muted); }
.coin b { font-size: 11.5px; font-weight: 600; line-height: 1.2; }
.settings .row { cursor: default; }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.seg button b { font-size: 15px; }
.seg button span { font-size: 11.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }

/* ---------- Selettore argomenti ---------- */
.picker { display: flex; flex-direction: column; gap: 14px; }
.picker-group h3 { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.pick { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.pick:last-child { border-bottom: 0; }
.pick .num { font-family: var(--f-display); font-size: 13px; color: var(--muted); text-align: center; }
.pick .t { display: flex; flex-direction: column; min-width: 0; }
.pick .t b { font-size: 14.5px; font-weight: 500; line-height: 1.3; }
.pick .box-c { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line-strong); display: grid; place-items: center; color: transparent; transition: all .15s; }
.pick[aria-pressed="true"] .box-c { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick .box-c svg { width: 16px; height: 16px; }
.picker-sum { position: sticky; top: -10px; z-index: 2; background: var(--bg); padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.until { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Overlay (sessione, onboarding) ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.ov-inner { width: 100%; max-width: 640px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ov-head { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.progress { flex: 1; height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; position: relative; }
.progress > i { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 999px; transition: width .4s cubic-bezier(.3, 1.3, .6, 1); }
.progress > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .35); }
.combo { font-weight: 700; color: var(--g-ver); font-size: 14px; display: flex; align-items: center; gap: 3px; min-width: 44px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.combo svg { width: 18px; height: 18px; }
.ov-body { flex: 1; min-height: 0; overflow-y: auto; padding-block: 8px 20px; display: flex; flex-direction: column; gap: 16px; }
.ov-foot { border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); transition: background .2s; }
.ov-foot.ok { background: var(--ok-soft); border-color: transparent; }
.ov-foot.err { background: var(--err-soft); border-color: transparent; }
.ov-foot.ok .foot-in, .ov-foot.err .foot-in { max-height: 62vh; overflow-y: auto; }
.foot-in { max-width: 640px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }

.ex-kind { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.ex-kind .tag { margin-left: auto; }
.prompt-title { font-size: 21px; font-weight: 600; line-height: 1.3; }
.latin-line { font-family: var(--f-latin); font-size: 26px; line-height: 1.45; display: flex; flex-wrap: wrap; gap: 2px 7px; }
.w { border: 0; background: none; padding: 0 1px; font: inherit; color: inherit; border-bottom: 2px dotted var(--line-strong); cursor: help; border-radius: 3px; }
.w:hover, .w.open { background: var(--accent-soft); border-bottom-color: var(--accent); }
.w.verb { color: var(--g-ver); border-bottom: 2px solid var(--g-ver); }
.it-line { font-size: 19px; line-height: 1.45; font-weight: 500; }
.speaker { display: flex; gap: 12px; align-items: flex-start; }
.speaker .bust { width: 46px; height: 46px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.speaker .bust svg { width: 28px; height: 28px; }
.bubble { background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 12px 14px; min-width: 0; }

.answer-zone { min-height: 112px; border-radius: 14px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 10px 2px; background-image: repeating-linear-gradient(to bottom, transparent 0 53px, var(--line-strong) 53px 55px); }
.bank-zone { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 6px; }
.tile {
  min-height: 44px; padding: 6px 13px; border-radius: 11px; border: 1.5px solid var(--line-strong); background: var(--surface); box-shadow: inset 0 -3px 0 var(--line);
  font-size: 17px; line-height: 1.2; transition: transform .1s, opacity .15s; color: var(--ink);
}
.tile.la { font-family: var(--f-latin); font-style: normal; font-size: 19px; }
.tile:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--line); }
.tile.used { background: var(--line); color: transparent; box-shadow: none; border-color: var(--line); pointer-events: none; }
.tile.pop { animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }
.typed { width: 100%; min-height: 120px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--surface); padding: 12px 14px; font-size: 18px; line-height: 1.45; resize: vertical; }
.typed.latin { font-family: var(--f-latin); font-size: 20px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); }
.tool svg { width: 16px; height: 16px; }
.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.options { display: grid; gap: 10px; }
.opt { min-height: 54px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--surface); box-shadow: inset 0 -3px 0 var(--line); padding: 10px 14px; text-align: left; font-size: 15.5px; display: flex; align-items: center; gap: 12px; }
.opt .k { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); flex: none; }
.opt.la-opt { font-family: var(--f-latin); font-size: 20px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.opt[aria-pressed="true"] .k { border-color: var(--accent); color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 -3px 0 var(--ok); }
.opt.wrong { border-color: var(--err); background: var(--err-soft); box-shadow: inset 0 -3px 0 var(--err); }
.bigword { font-family: var(--f-latin); font-size: 42px; line-height: 1.1; text-align: center; padding: 16px 0 4px; }
.lemma-note { text-align: center; color: var(--muted); font-size: 14px; }
.blank { display: inline-block; min-width: 72px; border-bottom: 3px solid var(--accent); color: var(--accent); text-align: center; }
.method-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.method-box ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }

.fb { display: flex; gap: 12px; align-items: flex-start; }
.fb-ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface); }
.fb-ico svg { width: 22px; height: 22px; }
.fb.ok .fb-ico { color: var(--ok); } .fb.err .fb-ico { color: var(--err); }
.fb-txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.fb-txt h3 { font-size: 19px; }
.fb.ok h3 { color: var(--ok); } .fb.err h3 { color: var(--err); }
.fb-txt p { margin: 0; font-size: 14.5px; }
.fb-txt .sol { font-weight: 600; }
.fb-txt .sol.la { font-weight: 400; font-size: 18px; font-style: normal; }
.fb-extra { display: flex; flex-wrap: wrap; gap: 8px; }
.errlist { margin: 4px 0 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.self { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thinking { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--muted); }
.stylus { width: 22px; height: 22px; color: var(--accent); animation: write 1.1s ease-in-out infinite; }
@keyframes write { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(6px, -2px) rotate(8deg); } }

.pop-word {
  position: fixed; z-index: 40; max-width: min(340px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); font-size: 14px;
}
.pop-word .pw-lemma { font-family: var(--f-latin); font-size: 18px; }
.pop-word .pw-mean { opacity: .85; }
.pop-word ul { margin: 6px 0 0; padding-left: 16px; }
.pop-word .pw-more { opacity: .7; font-size: 12.5px; margin-top: 4px; }

/* Riepilogo */
.result { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 18px; }
.result .laurel { width: 120px; height: 90px; color: var(--gold); }
.result h1 { font-family: var(--f-display); font-weight: 400; font-size: 32px; letter-spacing: .04em; }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.res-stat { border-radius: 14px; border: 2px solid var(--tc, var(--line)); overflow: hidden; background: var(--surface); }
.res-stat span { display: block; background: var(--tc, var(--line)); color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px; }
.res-stat b { display: block; font-size: 22px; padding: 8px 4px; font-variant-numeric: tabular-nums; }
.review { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.review .r-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.review .r-item .la { font-style: normal; font-size: 16px; }

/* Onboarding */
.onb-hero { display: flex; flex-direction: column; gap: 14px; padding-top: 24px; }
.onb-title { font-family: var(--f-display); font-size: 44px; letter-spacing: .2em; line-height: 1; }
.onb-sub { font-size: 17px; color: var(--muted); max-width: 40ch; margin: 0; }
.onb-steps { display: flex; gap: 6px; }
.onb-steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.onb-steps i.on { background: var(--accent); }
.feature-list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; }
.feature-list li { list-style: none; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.feature-list li svg { width: 22px; height: 22px; color: var(--accent); flex: none; margin-top: 1px; }
.feature-list b { display: block; font-weight: 600; }
.feature-list span { font-size: 13.5px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }

/* Foglio dal basso */
.sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 22, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { width: 100%; max-width: 640px; max-height: 88%; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .25s cubic-bezier(.2, .9, .3, 1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { flex: 1; font-size: 18px; }
.sheet-body { overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); border-radius: 22px; padding: 22px; margin: auto 16px; max-width: 420px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; animation: up .25s; }
.sheet-back.center { align-items: center; }
.toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); animation: down .25s; max-width: 440px; text-align: center; }
@keyframes down { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
canvas.confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; width: 100%; height: 100%; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty svg { width: 42px; height: 42px; color: var(--line-strong); }
.note { font-size: 13px; color: var(--muted); }

@media (min-width: 720px) {
  .latin-line { font-size: 30px; }
  .modes { grid-template-columns: repeat(3, 1fr); }
  .mode.wide { grid-column: span 3; }
  .coins { grid-template-columns: repeat(5, 1fr); }
}
@media (max-width: 360px) {
  .mosaic { gap: 4px; padding: 6px; }
  .tess .lbl { font-size: 8.5px; }
  .latin-line { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

<script>
/* VERTO — motore morfologico latino (biennio).
   Genera tutte le forme dal paradigma e costruisce un indice forma → analisi.
   Ogni analisi porta gli argomenti di programma necessari per riconoscerla (req). */
(function (root) {
  'use strict';

  const CASES = ['nom', 'gen', 'dat', 'acc', 'voc', 'abl'];
  const CASE_IT = { nom: 'nominativo', gen: 'genitivo', dat: 'dativo', acc: 'accusativo', voc: 'vocativo', abl: 'ablativo', loc: 'locativo' };
  const NUM_IT = { s: 'singolare', p: 'plurale' };
  const GEN_IT = { m: 'maschile', f: 'femminile', n: 'neutro' };
  const PERS = ['1ª pers. sing.', '2ª pers. sing.', '3ª pers. sing.', '1ª pers. plur.', '2ª pers. plur.', '3ª pers. plur.'];
  const TENSE_IT = { pres: 'presente', impf: 'imperfetto', fut: 'futuro semplice', perf: 'perfetto', ppf: 'piuccheperfetto', futant: 'futuro anteriore' };
  const PE6 = ['m', 's', 't', 'mus', 'tis', 'nt'];
  const PP6 = ['r', 'ris', 'tur', 'mur', 'mini', 'ntur'];

  function norm(w) {
    return String(w).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/j/g, 'i');
  }
  function syl(w) { return (norm(w).match(/ae|au|oe|[aeiouy]/g) || []).length; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  const isCons = (ch) => ch && !'aeiouy'.includes(ch);

  /* ---------- Nomi ---------- */
  const D1 = { s: ['a', 'ae', 'ae', 'am', 'a', 'a'], p: ['ae', 'arum', 'is', 'as', 'ae', 'is'] };
  const D2M = { s: ['us', 'i', 'o', 'um', 'e', 'o'], p: ['i', 'orum', 'is', 'os', 'i', 'is'] };
  const D2N = { s: ['um', 'i', 'o', 'um', 'um', 'o'], p: ['a', 'orum', 'is', 'a', 'a', 'is'] };
  const D4M = { s: ['us', 'us', 'ui', 'um', 'us', 'u'], p: ['us', 'uum', 'ibus', 'us', 'us', 'ibus'] };
  const D4N = { s: ['u', 'us', 'u', 'u', 'u', 'u'], p: ['ua', 'uum', 'ibus', 'ua', 'ua', 'ibus'] };
  const D5 = { s: ['es', 'ei', 'ei', 'em', 'es', 'e'], p: ['es', 'erum', 'ebus', 'es', 'es', 'ebus'] };
  const GP_UM = ['pater', 'mater', 'frater', 'iuvenis', 'canis', 'senex', 'accipiter', 'vates'];

  function nounInfo(e) {
    const { nom, gen } = e;
    if (e.pl) {
      if (gen.endsWith('arum')) return { d: 1, stem: gen.slice(0, -4) };
      if (gen.endsWith('orum')) return { d: 2, stem: gen.slice(0, -4) };
      if (gen.endsWith('uum')) return { d: 4, stem: gen.slice(0, -3) };
      if (gen.endsWith('ium')) return { d: 3, stem: gen.slice(0, -3), gp: 'ium' };
      return { d: 3, stem: gen.slice(0, -2), gp: 'um' };
    }
    if (gen.endsWith('ae')) return { d: 1, stem: gen.slice(0, -2) };
    if (gen.endsWith('ei') && nom.endsWith('es')) return { d: 5, stem: gen.slice(0, -2) };
    if (gen.endsWith('i')) return { d: 2, stem: gen.slice(0, -1) };
    if (gen.endsWith('us')) return { d: 4, stem: gen.slice(0, -2) };
    if (gen.endsWith('is')) return { d: 3, stem: gen.slice(0, -2) };
    throw new Error('Nome non riconosciuto: ' + nom);
  }

  function nounForms(e) {
    const inf = nounInfo(e);
    const { d, stem } = inf;
    const g = e.g;
    const out = []; // {f, c, n}
    const push = (f, c, n) => out.push({ f, c, n });
    let tab;
    if (d === 1) tab = D1;
    else if (d === 2) tab = g === 'n' ? D2N : D2M;
    else if (d === 4) tab = g === 'n' ? D4N : D4M;
    else if (d === 5) tab = D5;
    if (e.only) return { info: inf, forms: (e.extra || []).map((x) => ({ f: x.f, c: x.c, n: x.n })) };
    if (d === 3) {
      let gp = e.gp || inf.gp;
      const nomN = norm(e.nom);
      const neutI = g === 'n' && (/(e|al|ar)$/.test(nomN) || (e.pl && gp === 'ium'));
      if (!gp) {
        if (neutI) gp = 'ium';
        else if (GP_UM.includes(nomN)) gp = 'um';
        else if (g !== 'n' && syl(e.nom) === syl(e.gen) && /(is|es)$/.test(nomN)) gp = 'ium';
        else if (syl(e.nom) === 1 && /[sx]$/.test(nomN) && isCons(stem.slice(-1)) && isCons(stem.slice(-2, -1))) gp = 'ium';
        else gp = 'um';
      }
      const ablS = neutI ? 'i' : 'e';
      const plN = neutI ? 'ia' : 'a';
      if (!e.pl) {
        if (g === 'n') {
          [e.nom, stem + 'is', stem + 'i', e.nom, e.nom, stem + ablS].forEach((f, i) => push(f, CASES[i], 's'));
        } else {
          [e.nom, stem + 'is', stem + 'i', stem + 'em', e.nom, stem + ablS].forEach((f, i) => push(f, CASES[i], 's'));
        }
        if (e.ablI) push(stem + 'i', 'abl', 's');
      }
      if (!e.sg) {
        if (g === 'n') [stem + plN, stem + gp, stem + 'ibus', stem + plN, stem + plN, stem + 'ibus'].forEach((f, i) => push(f, CASES[i], 'p'));
        else [stem + 'es', stem + gp, stem + 'ibus', stem + 'es', stem + 'es', stem + 'ibus'].forEach((f, i) => push(f, CASES[i], 'p'));
      }
    } else {
      if (!e.pl) {
        tab.s.forEach((end, i) => {
          let f = stem + end;
          if (i === 0) f = e.nom;
          if (d === 2 && g !== 'n') {
            if (i === 4) {
              if (!e.nom.endsWith('us')) f = e.nom;
              else if (e.nom.endsWith('ius') && !e.adjLike) f = e.nom.slice(0, -3) + 'i';
            }
          }
          if (d === 1 && i === 4 && !e.nom.endsWith('a')) f = stem + 'a';
          push(f, CASES[i], 's');
        });
      }
      if (!e.sg) tab.p.forEach((end, i) => push(stem + end, CASES[i], 'p'));
      if (e.abus && !e.sg) { push(stem + 'abus', 'dat', 'p'); push(stem + 'abus', 'abl', 'p'); }
    }
    if (e.extra) e.extra.forEach((x) => push(x.f, x.c, x.n));
    if (e.loc) push(e.loc, 'loc', e.pl ? 'p' : 's');
    const drop = e.drop || [];
    return { info: inf, forms: out.filter((x) => !drop.includes(x.f)) };
  }

  /* ---------- Aggettivi ---------- */
  function adjInfo(a) {
    // a.parts = [m, f, n] oppure [m, gen] ecc.
    const [p1, p2, p3] = a.parts;
    if (p2 && p2.endsWith('a') && p3 && p3.endsWith('um')) return { cls: 1, stem: p2.slice(0, -1), m: p1 };
    if (p2 && p2.endsWith('is') && p3 && p3.endsWith('e')) return { cls: 2, kind: 3, stem: p3.slice(0, -1), m: p1, f: p2, n: p3 };
    if (p2 && p2.endsWith('e') && p1.endsWith('is')) return { cls: 2, kind: 2, stem: p1.slice(0, -2), m: p1, f: p1, n: p2 };
    if (p2 && p2.endsWith('is')) return { cls: 2, kind: 1, stem: p2.slice(0, -2), m: p1, f: p1, n: p1 };
    throw new Error('Aggettivo non riconosciuto: ' + a.parts.join(','));
  }

  // restituisce [{f,c,n,g}]
  function decl1Adj(mNom, stem, opts = {}) {
    const out = [];
    const pron = opts.pron;
    const mEnd = mNom.endsWith('us');
    D2M.s.forEach((end, i) => {
      let f = stem + end;
      if (i === 0) f = mNom;
      if (i === 4) f = mEnd ? (opts.vocMi ? 'mi' : stem + 'e') : mNom;
      if (pron && i === 1) f = stem + 'ius';
      if (pron && i === 2) f = stem + 'i';
      out.push({ f, c: CASES[i], n: 's', g: 'm' });
    });
    D1.s.forEach((end, i) => {
      let f = stem + end;
      if (pron && i === 1) f = stem + 'ius';
      if (pron && i === 2) f = stem + 'i';
      out.push({ f, c: CASES[i], n: 's', g: 'f' });
    });
    D2N.s.forEach((end, i) => {
      let f = stem + end;
      if (pron && i === 1) f = stem + 'ius';
      if (pron && i === 2) f = stem + 'i';
      if (opts.neutD && (i === 0 || i === 3 || i === 4)) f = opts.neutD;
      out.push({ f, c: CASES[i], n: 's', g: 'n' });
    });
    D2M.p.forEach((end, i) => out.push({ f: stem + end, c: CASES[i], n: 'p', g: 'm' }));
    D1.p.forEach((end, i) => out.push({ f: stem + end, c: CASES[i], n: 'p', g: 'f' }));
    D2N.p.forEach((end, i) => out.push({ f: stem + end, c: CASES[i], n: 'p', g: 'n' }));
    if (pron) return out.filter((x) => x.c !== 'voc');
    return out;
  }

  function decl3Adj(nomM, nomF, nomN, stem, iStem = true, ablE = false) {
    const out = [];
    const abl = iStem && !ablE ? 'i' : 'e';
    const gp = iStem ? 'ium' : 'um';
    const npl = iStem ? 'ia' : 'a';
    for (const [g, nom] of [['m', nomM], ['f', nomF]]) {
      [nom, stem + 'is', stem + 'i', stem + 'em', nom, stem + abl].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g }));
      if (ablE && iStem) out.push({ f: stem + 'i', c: 'abl', n: 's', g });
      [stem + 'es', stem + gp, stem + 'ibus', stem + 'es', stem + 'es', stem + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g }));
    }
    [nomN, stem + 'is', stem + 'i', nomN, nomN, stem + abl].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g: 'n' }));
    if (ablE && iStem) out.push({ f: stem + 'i', c: 'abl', n: 's', g: 'n' });
    [stem + npl, stem + gp, stem + 'ibus', stem + npl, stem + npl, stem + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g: 'n' }));
    return out;
  }

  function comparativeForms(cstem) {
    // cstem es. 'alt' → altior, altius
    const out = [];
    const m = cstem + 'ior', n = cstem + 'ius', st = cstem + 'ior';
    for (const g of ['m', 'f']) {
      [m, st + 'is', st + 'i', st + 'em', m, st + 'e'].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g }));
      [st + 'es', st + 'um', st + 'ibus', st + 'es', st + 'es', st + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g }));
    }
    [n, st + 'is', st + 'i', n, n, st + 'e'].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g: 'n' }));
    [st + 'a', st + 'um', st + 'ibus', st + 'a', st + 'a', st + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g: 'n' }));
    return out;
  }

  const COMP_IRR = {
    bonus: ['mel', 'optimus'], malus: ['pe', 'pessimus'], magnus: ['ma', 'maximus'], parvus: ['min', 'minimus'], multus: [null, 'plurimus'],
  };
  const ILLIMUS = ['facilis', 'difficilis', 'similis', 'dissimilis', 'humilis', 'gracilis'];

  function adjForms(a) {
    const info = adjInfo(a);
    let pos;
    if (info.cls === 1) pos = decl1Adj(info.m, info.stem, { pron: a.pron, vocMi: a.vocMi, neutD: a.neutD });
    else pos = decl3Adj(info.m, info.f, info.n, info.stem, !a.cons, false);
    if (a.extra) a.extra.forEach((x) => pos.push(x));
    const res = pos.map((x) => ({ ...x, deg: 'pos' }));
    if (!a.nocomp && !a.pron) {
      const irr = COMP_IRR[norm(info.m)];
      let cstem, sup;
      if (irr) {
        cstem = irr[0];
        sup = irr[1];
      } else {
        cstem = info.stem;
        if (norm(info.m).endsWith('er')) sup = info.m + 'rimus';
        else if (ILLIMUS.includes(norm(info.m))) sup = info.stem + 'limus';
        else sup = info.stem + 'issimus';
      }
      if (cstem) {
        const cs = cstem === 'mel' ? 'mel' : cstem;
        let cf;
        if (cs === 'mel') cf = comparativeForms('mel');
        else if (cs === 'pe') cf = comparativeForms('pe');
        else if (cs === 'ma') cf = comparativeForms('ma');
        else if (cs === 'min') cf = comparativeForms('min').map((x) => ({ ...x, f: x.f.replace(/^miniu/, 'minu').replace(/^minio/, 'mino') }));
        else cf = comparativeForms(cs);
        if (cs === 'min') {
          // minor, minus, minoris...
          cf = comparativeForms('min').map((x) => ({ ...x, f: x.f.replace(/^minior/, 'minor').replace(/^minius$/, 'minus') }));
        }
        if (cs === 'ma') cf = cf.map((x) => ({ ...x, f: x.f.replace(/^maior|^maius/, (s) => s) }));
        cf.forEach((x) => res.push({ ...x, deg: 'comp' }));
      } else if (norm(info.m) === 'multus') {
        [['plus', 'nom', 's', 'n'], ['pluris', 'gen', 's', 'n'], ['plus', 'acc', 's', 'n'], ['plure', 'abl', 's', 'n']].forEach(([f, c, n, g]) => res.push({ f, c, n, g, deg: 'comp' }));
        for (const g of ['m', 'f']) [['plures', 'nom'], ['plurium', 'gen'], ['pluribus', 'dat'], ['plures', 'acc'], ['pluribus', 'abl']].forEach(([f, c]) => res.push({ f, c, n: 'p', g, deg: 'comp' }));
        [['plura', 'nom'], ['plurium', 'gen'], ['pluribus', 'dat'], ['plura', 'acc'], ['pluribus', 'abl']].forEach(([f, c]) => res.push({ f, c, n: 'p', g: 'n', deg: 'comp' }));
      }
      const sstem = sup.slice(0, -2);
      decl1Adj(sup, sstem).forEach((x) => res.push({ ...x, deg: 'sup' }));
    }
    return { info, forms: res };
  }

  /* ---------- Verbi ---------- */
  const PRES_ACT = { 1: ['o', 'as', 'at', 'amus', 'atis', 'ant'], 2: ['eo', 'es', 'et', 'emus', 'etis', 'ent'], 3: ['o', 'is', 'it', 'imus', 'itis', 'unt'], 4: ['io', 'is', 'it', 'imus', 'itis', 'iunt'], 5: ['io', 'is', 'it', 'imus', 'itis', 'iunt'] };
  const IMPF_V = { 1: 'a', 2: 'e', 3: 'e', 4: 'ie', 5: 'ie' };
  const FUT_ACT = { 1: ['abo', 'abis', 'abit', 'abimus', 'abitis', 'abunt'], 2: ['ebo', 'ebis', 'ebit', 'ebimus', 'ebitis', 'ebunt'], 3: ['am', 'es', 'et', 'emus', 'etis', 'ent'], 4: ['iam', 'ies', 'iet', 'iemus', 'ietis', 'ient'], 5: ['iam', 'ies', 'iet', 'iemus', 'ietis', 'ient'] };
  const PRES_PASS = { 1: ['or', 'aris', 'atur', 'amur', 'amini', 'antur'], 2: ['eor', 'eris', 'etur', 'emur', 'emini', 'entur'], 3: ['or', 'eris', 'itur', 'imur', 'imini', 'untur'], 4: ['ior', 'iris', 'itur', 'imur', 'imini', 'iuntur'], 5: ['ior', 'eris', 'itur', 'imur', 'imini', 'iuntur'] };
  const FUT_PASS = { 1: ['abor', 'aberis', 'abitur', 'abimur', 'abimini', 'abuntur'], 2: ['ebor', 'eberis', 'ebitur', 'ebimur', 'ebimini', 'ebuntur'], 3: ['ar', 'eris', 'etur', 'emur', 'emini', 'entur'], 4: ['iar', 'ieris', 'ietur', 'iemur', 'iemini', 'ientur'], 5: ['iar', 'ieris', 'ietur', 'iemur', 'iemini', 'ientur'] };
  const SUBJ_V = { 1: 'e', 2: 'ea', 3: 'a', 4: 'ia', 5: 'ia' };
  const IMPER = { 1: ['a', 'ate'], 2: ['e', 'ete'], 3: ['e', 'ite'], 4: ['i', 'ite'], 5: ['e', 'ite'] };
  const IMPER_P = { 1: ['are', 'amini'], 2: ['ere', 'emini'], 3: ['ere', 'imini'], 4: ['ire', 'imini'], 5: ['ere', 'imini'] };
  const INF_PASS = { 1: 'ari', 2: 'eri', 3: 'i', 4: 'iri', 5: 'i' };
  const INF_ACT = { 1: 'are', 2: 'ere', 3: 'ere', 4: 'ire', 5: 'ere' };
  const PART_PRES = { 1: ['ans', 'ant'], 2: ['ens', 'ent'], 3: ['ens', 'ent'], 4: ['iens', 'ient'], 5: ['iens', 'ient'] };
  const PERF_E = ['i', 'isti', 'it', 'imus', 'istis', 'erunt'];
  const FUTANT_E = ['ero', 'eris', 'erit', 'erimus', 'eritis', 'erint'];
  const SPERF_E = ['erim', 'eris', 'erit', 'erimus', 'eritis', 'erint'];

  function conjOf(pres, inf) {
    if (inf.endsWith('are')) return 1;
    if (inf.endsWith('ire')) return 4;
    if (pres.endsWith('eo')) return 2;
    if (pres.endsWith('io')) return 5;
    return 3;
  }
  function depConjOf(pres, inf) {
    if (inf.endsWith('ari')) return [1, inf.slice(0, -3)];
    if (inf.endsWith('eri') && pres.endsWith('eor')) return [2, inf.slice(0, -3)];
    if (inf.endsWith('iri')) return [4, inf.slice(0, -3)];
    if (pres.endsWith('ior')) return [5, inf.slice(0, -1)];
    return [3, inf.slice(0, -1)];
  }

  // F: costruttore di forme verbali
  function VF(list, base) {
    return function add(f, mood, tense, voice, p, extraReq, extra) {
      if (!f) return;
      const req = new Set([base]);
      if (mood === 'ind' && (tense === 'impf' || tense === 'fut')) req.add('v_if');
      if (['perf', 'ppf', 'futant'].includes(tense)) req.add('v_perf');
      if (mood === 'cong') req.add('v_cong');
      if (mood === 'imp') req.add('v_imper');
      if (voice === 'pass' && base !== 'v_dep') req.add('v_pass');
      if (mood === 'cong' && tense === 'impf' && voice === 'pass' && base !== 'v_dep') req.add('v_pass');
      (extraReq || []).forEach((r) => req.add(r));
      list.push({ f, mood, tense, voice, p, req: [...req], ...(extra || {}) });
    };
  }

  function participleDecl(add, nom, stem, kind) {
    // kind: 'pres' (amans, amantis), 'perf', 'fut'
    if (kind === 'pres') {
      decl3Adj(nom, nom, nom, stem, true, true).forEach((x) => add(x.f, 'part', 'pres', null, null, ['v_part'], { c: x.c, n: x.n, g: x.g }));
    } else {
      const st = nom.slice(0, -2);
      decl1Adj(nom, st).forEach((x) => {
        if (x.c === 'voc') return;
        const req = kind === 'perf' && (x.c === 'nom') ? ['v_perf'] : ['v_part'];
        add(x.f, 'part', kind, null, null, req, { c: x.c, n: x.n, g: x.g });
      });
    }
  }

  function regularVerbForms(v) {
    const list = [];
    const base = v.t || 'v_pres';
    const add = VF(list, base);
    const k = conjOf(v.pres, v.inf);
    const R = v.inf.slice(0, -3);
    PRES_ACT[k].forEach((e, i) => add(R + e, 'ind', 'pres', 'act', i));
    PE6.forEach((e, i) => add(R + IMPF_V[k] + 'ba' + e.replace(/^m$/, 'm'), 'ind', 'impf', 'act', i));
    FUT_ACT[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'act', i));
    add(v.imp || R + IMPER[k][0], 'imp', 'pres', 'act', 1);
    add(R + IMPER[k][1], 'imp', 'pres', 'act', 4);
    add(v.inf, 'inf', 'pres', 'act', null);
    PE6.forEach((e, i) => add(R + SUBJ_V[k] + e, 'cong', 'pres', 'act', i));
    PE6.forEach((e, i) => add(v.inf + e, 'cong', 'impf', 'act', i));
    if (!v.intr) {
      PRES_PASS[k].forEach((e, i) => add(R + e, 'ind', 'pres', 'pass', i));
      PP6.forEach((e, i) => add(R + IMPF_V[k] + 'ba' + e, 'ind', 'impf', 'pass', i));
      FUT_PASS[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'pass', i));
      add(R + INF_PASS[k], 'inf', 'pres', 'pass', null);
      PP6.forEach((e, i) => add(R + SUBJ_V[k] + e, 'cong', 'pres', 'pass', i));
      PP6.forEach((e, i) => add(v.inf + e, 'cong', 'impf', 'pass', i));
    }
    const [ps, pt] = PART_PRES[k];
    participleDecl(add, R + ps, R + pt, 'pres');
    perfectSystem(add, v);
    return { conj: k, forms: list };
  }

  function perfectSystem(add, v) {
    if (v.perf && v.perf !== '-') {
      const P = v.perf.slice(0, -1);
      PERF_E.forEach((e, i) => add(P + e, 'ind', 'perf', 'act', i));
      add(P + 'ere', 'ind', 'perf', 'act', 5);
      PE6.forEach((e, i) => add(P + 'era' + e, 'ind', 'ppf', 'act', i));
      FUTANT_E.forEach((e, i) => add(P + e, 'ind', 'futant', 'act', i));
      SPERF_E.forEach((e, i) => add(P + e, 'cong', 'perf', 'act', i));
      PE6.forEach((e, i) => add(P + 'isse' + e, 'cong', 'ppf', 'act', i));
      add(P + 'isse', 'inf', 'perf', 'act', null, ['v_inf']);
    }
    if (v.sup && v.sup !== '-') {
      const S = v.sup.slice(0, -2);
      if (!v.intr) participleDecl(add, S + 'us', null, 'perf');
      participleDecl(add, v.fp || S + 'urus', null, 'fut');
    }
  }

  function deponentForms(v) {
    const list = [];
    const base = 'v_dep';
    const add = VF(list, base);
    const [k, R] = depConjOf(v.pres, v.inf);
    const virtInf = R + INF_ACT[k];
    PRES_PASS[k].forEach((e, i) => add(R + e, 'ind', 'pres', 'dep', i));
    PP6.forEach((e, i) => add(R + IMPF_V[k] + 'ba' + e, 'ind', 'impf', 'dep', i));
    FUT_PASS[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'dep', i));
    add(v.inf, 'inf', 'pres', 'dep', null);
    add(R + IMPER_P[k][0], 'imp', 'pres', 'dep', 1);
    add(R + IMPER_P[k][1], 'imp', 'pres', 'dep', 4);
    PP6.forEach((e, i) => add(R + SUBJ_V[k] + e, 'cong', 'pres', 'dep', i));
    PP6.forEach((e, i) => add(virtInf + e, 'cong', 'impf', 'dep', i));
    const [ps, pt] = PART_PRES[k];
    participleDecl(add, R + ps, R + pt, 'pres');
    participleDecl(add, v.part, null, 'perf');
    participleDecl(add, v.fp || v.part.slice(0, -2) + 'urus', null, 'fut');
    return { conj: k, forms: list };
  }

  function semiDepForms(v) {
    // audeo, ausus sum: presente attivo, perfetto con participio
    const list = [];
    const add = VF(list, 'v_dep');
    const k = conjOf(v.pres, v.inf);
    const R = v.inf.slice(0, -3);
    PRES_ACT[k].forEach((e, i) => add(R + e, 'ind', 'pres', 'act', i));
    PE6.forEach((e, i) => add(R + IMPF_V[k] + 'ba' + e, 'ind', 'impf', 'act', i));
    FUT_ACT[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'act', i));
    add(v.inf, 'inf', 'pres', 'act', null);
    PE6.forEach((e, i) => add(R + SUBJ_V[k] + e, 'cong', 'pres', 'act', i));
    PE6.forEach((e, i) => add(v.inf + e, 'cong', 'impf', 'act', i));
    const [ps, pt] = PART_PRES[k];
    participleDecl(add, R + ps, R + pt, 'pres');
    participleDecl(add, v.part, null, 'perf');
    return { conj: k, forms: list };
  }

  /* Verbi irregolari */
  const SUM = {
    'ind.pres': ['sum', 'es', 'est', 'sumus', 'estis', 'sunt'],
    'ind.impf': ['eram', 'eras', 'erat', 'eramus', 'eratis', 'erant'],
    'ind.fut': ['ero', 'eris', 'erit', 'erimus', 'eritis', 'erunt'],
    'cong.pres': ['sim', 'sis', 'sit', 'simus', 'sitis', 'sint'],
    'cong.impf': ['essem', 'esses', 'esset', 'essemus', 'essetis', 'essent'],
  };
  function irregularTable(add, T) {
    for (const key in T) {
      const [mood, tense] = key.split('.');
      const voice = key.split('.')[2] || 'act';
      T[key].forEach((f, i) => { if (f) add(f, mood, tense, voice, i); });
    }
  }
  function perfFrom(add, perf, voice = 'act') {
    const P = perf.slice(0, -1);
    PERF_E.forEach((e, i) => add(P + e, 'ind', 'perf', voice, i));
    PE6.forEach((e, i) => add(P + 'era' + e, 'ind', 'ppf', voice, i));
    FUTANT_E.forEach((e, i) => add(P + e, 'ind', 'futant', voice, i));
    SPERF_E.forEach((e, i) => add(P + e, 'cong', 'perf', voice, i));
    PE6.forEach((e, i) => add(P + 'isse' + e, 'cong', 'ppf', voice, i));
    add(P + 'isse', 'inf', 'perf', voice, null, ['v_inf']);
  }

  function sumForms(prefix = '', perfPre = '', base = 'v_pres', prod = false) {
    const list = [];
    const add = VF(list, base);
    const pf = (f) => {
      if (!prefix) return f;
      if (prod && /^e/.test(f)) return 'prod' + f;
      return prefix + f;
    };
    for (const key in SUM) {
      const [mood, tense] = key.split('.');
      SUM[key].forEach((f, i) => add(pf(f), mood, tense, null, i));
    }
    add(pf('esse'), 'inf', 'pres', null, null);
    add(pf('es'), 'imp', 'pres', null, 1);
    add(pf('este'), 'imp', 'pres', null, 4);
    perfFrom(add, (prefix ? perfPre : '') + 'fui', null);
    if (!prefix) {
      participleDecl(add, 'futurus', null, 'fut');
      add('fore', 'inf', 'fut', null, null, ['v_inf']);
    } else if (prefix === 'ab') {
      participleDecl(add, 'absens', 'absent', 'pres');
    } else if (prefix === 'prae') {
      participleDecl(add, 'praesens', 'praesent', 'pres');
    }
    return list;
  }

  function possumForms() {
    const list = [];
    const add = VF(list, 'v_poss');
    for (const key in SUM) {
      const [mood, tense] = key.split('.');
      SUM[key].forEach((f, i) => add((/^s/.test(f) ? 'pos' : 'pot') + f, mood, tense, null, i));
    }
    // correzioni: potes, potest, potestis
    add('posse', 'inf', 'pres', null, null);
    perfFrom(add, 'potui', null);
    // poss + essem → possem
    return list.map((x) => ({ ...x, f: x.f.replace(/^potess/, 'poss') }));
  }

  function eoForms(prefix = '', base = 'v_irr') {
    const list = [];
    const add = VF(list, base);
    const p = (f) => prefix + f;
    const T = {
      'ind.pres': ['eo', 'is', 'it', 'imus', 'itis', 'eunt'],
      'ind.impf': ['ibam', 'ibas', 'ibat', 'ibamus', 'ibatis', 'ibant'],
      'ind.fut': ['ibo', 'ibis', 'ibit', 'ibimus', 'ibitis', 'ibunt'],
      'ind.perf': ['ii', 'isti', 'iit', 'iimus', 'istis', 'ierunt'],
      'ind.ppf': ['ieram', 'ieras', 'ierat', 'ieramus', 'ieratis', 'ierant'],
      'ind.futant': ['iero', 'ieris', 'ierit', 'ierimus', 'ieritis', 'ierint'],
      'cong.pres': ['eam', 'eas', 'eat', 'eamus', 'eatis', 'eant'],
      'cong.impf': ['irem', 'ires', 'iret', 'iremus', 'iretis', 'irent'],
      'cong.perf': ['ierim', 'ieris', 'ierit', 'ierimus', 'ieritis', 'ierint'],
      'cong.ppf': ['issem', 'isses', 'isset', 'issemus', 'issetis', 'issent'],
    };
    for (const key in T) {
      const [mood, tense] = key.split('.');
      T[key].forEach((f, i) => add(p(f), mood, tense, null, i));
    }
    if (!prefix) PERF_E.forEach((e, i) => add('iv' + e, 'ind', 'perf', null, i));
    add(p('ire'), 'inf', 'pres', null, null);
    add(p('isse'), 'inf', 'perf', null, null, ['v_inf']);
    add(p('i'), 'imp', 'pres', null, 1);
    add(p('ite'), 'imp', 'pres', null, 4);
    // participio presente iens, euntis
    const pp = [];
    decl3Adj(p('iens'), p('iens'), p('iens'), p('eunt'), true, true).forEach((x) => pp.push(x));
    pp.forEach((x) => add(x.f, 'part', 'pres', null, null, ['v_part'], { c: x.c, n: x.n, g: x.g }));
    participleDecl(add, p('iturus'), null, 'fut');
    return list;
  }

  function feroForms(prefix = '', perf = 'tuli', sup = 'latum', base = 'v_irr') {
    const list = [];
    const add = VF(list, base);
    const p = (f) => prefix + f;
    const T = {
      'ind.pres': ['fero', 'fers', 'fert', 'ferimus', 'fertis', 'ferunt'],
      'ind.impf': ['ferebam', 'ferebas', 'ferebat', 'ferebamus', 'ferebatis', 'ferebant'],
      'ind.fut': ['feram', 'feres', 'feret', 'feremus', 'feretis', 'ferent'],
      'cong.pres': ['feram', 'feras', 'ferat', 'feramus', 'feratis', 'ferant'],
      'cong.impf': ['ferrem', 'ferres', 'ferret', 'ferremus', 'ferretis', 'ferrent'],
      'ind.pres.pass': ['feror', 'ferris', 'fertur', 'ferimur', 'ferimini', 'feruntur'],
      'ind.impf.pass': ['ferebar', 'ferebaris', 'ferebatur', 'ferebamur', 'ferebamini', 'ferebantur'],
      'ind.fut.pass': ['ferar', 'fereris', 'feretur', 'feremur', 'feremini', 'ferentur'],
      'cong.pres.pass': ['ferar', 'feraris', 'feratur', 'feramur', 'feramini', 'ferantur'],
      'cong.impf.pass': ['ferrer', 'ferreris', 'ferretur', 'ferremur', 'ferremini', 'ferrentur'],
    };
    for (const key in T) {
      const [mood, tense, voice] = key.split('.');
      T[key].forEach((f, i) => add(p(f), mood, tense, voice || 'act', i));
    }
    add(p('ferre'), 'inf', 'pres', 'act', null);
    add(p('ferri'), 'inf', 'pres', 'pass', null);
    add(p('fer'), 'imp', 'pres', 'act', 1);
    add(p('ferte'), 'imp', 'pres', 'act', 4);
    participleDecl(add, p('ferens'), p('ferent'), 'pres');
    perfectSystem(add, { perf, sup });
    return list;
  }

  function voloForms(which) {
    const list = [];
    const add = VF(list, 'v_irr');
    const T = {
      volo: {
        'ind.pres': ['volo', 'vis', 'vult', 'volumus', 'vultis', 'volunt'],
        'ind.impf': ['volebam', 'volebas', 'volebat', 'volebamus', 'volebatis', 'volebant'],
        'ind.fut': ['volam', 'voles', 'volet', 'volemus', 'voletis', 'volent'],
        'cong.pres': ['velim', 'velis', 'velit', 'velimus', 'velitis', 'velint'],
        'cong.impf': ['vellem', 'velles', 'vellet', 'vellemus', 'velletis', 'vellent'],
      },
      nolo: {
        'ind.pres': ['nolo', null, null, 'nolumus', null, 'nolunt'],
        'ind.impf': ['nolebam', 'nolebas', 'nolebat', 'nolebamus', 'nolebatis', 'nolebant'],
        'ind.fut': ['nolam', 'noles', 'nolet', 'nolemus', 'noletis', 'nolent'],
        'cong.pres': ['nolim', 'nolis', 'nolit', 'nolimus', 'nolitis', 'nolint'],
        'cong.impf': ['nollem', 'nolles', 'nollet', 'nollemus', 'nolletis', 'nollent'],
      },
      malo: {
        'ind.pres': ['malo', 'mavis', 'mavult', 'malumus', 'mavultis', 'malunt'],
        'ind.impf': ['malebam', 'malebas', 'malebat', 'malebamus', 'malebatis', 'malebant'],
        'ind.fut': ['malam', 'males', 'malet', 'malemus', 'maletis', 'malent'],
        'cong.pres': ['malim', 'malis', 'malit', 'malimus', 'malitis', 'malint'],
        'cong.impf': ['mallem', 'malles', 'mallet', 'mallemus', 'malletis', 'mallent'],
      },
    }[which];
    for (const key in T) { const [mood, tense] = key.split('.'); T[key].forEach((f, i) => { if (f) add(f, mood, tense, null, i); }); }
    add({ volo: 'velle', nolo: 'nolle', malo: 'malle' }[which], 'inf', 'pres', null, null);
    perfFrom(add, { volo: 'volui', nolo: 'nolui', malo: 'malui' }[which], null);
    if (which === 'nolo') { add('noli', 'imp', 'pres', null, 1); add('nolite', 'imp', 'pres', null, 4); }
    if (which !== 'malo') participleDecl(add, which === 'volo' ? 'volens' : 'nolens', which === 'volo' ? 'volent' : 'nolent', 'pres');
    return list;
  }

  function fioForms() {
    const list = [];
    const add = VF(list, 'v_irr');
    irregularTable(add, {
      'ind.pres': ['fio', 'fis', 'fit', 'fimus', 'fitis', 'fiunt'],
      'ind.impf': ['fiebam', 'fiebas', 'fiebat', 'fiebamus', 'fiebatis', 'fiebant'],
      'ind.fut': ['fiam', 'fies', 'fiet', 'fiemus', 'fietis', 'fient'],
      'cong.pres': ['fiam', 'fias', 'fiat', 'fiamus', 'fiatis', 'fiant'],
      'cong.impf': ['fierem', 'fieres', 'fieret', 'fieremus', 'fieretis', 'fierent'],
    });
    add('fieri', 'inf', 'pres', 'act', null);
    return list;
  }

  /* ---------- Pronomi ---------- */
  // tabelle: [g][n] = 6 forme (nom, gen, dat, acc, voc, abl); null = manca
  const PRON = {
    is: {
      m: { s: ['is', 'eius', 'ei', 'eum', null, 'eo'], p: ['ei|ii', 'eorum', 'eis|iis', 'eos', null, 'eis|iis'] },
      f: { s: ['ea', 'eius', 'ei', 'eam', null, 'ea'], p: ['eae', 'earum', 'eis|iis', 'eas', null, 'eis|iis'] },
      n: { s: ['id', 'eius', 'ei', 'id', null, 'eo'], p: ['ea', 'eorum', 'eis|iis', 'ea', null, 'eis|iis'] },

      f: { s: ['eadem', 'eiusdem', 'eidem', 'eandem', null, 'eadem'], p: ['eaedem', 'earundem', 'eisdem|isdem', 'easdem', null, 'eisdem|isdem'] },
      n: { s: ['idem', 'eiusdem', 'eidem', 'idem', null, 'eodem'], p: ['eadem', 'eorundem', 'eisdem|isdem', 'eadem', null, 'eisdem|isdem'] },
    },
    qui: {

      n: { s: ['quod', 'cuius', 'cui', 'quod', null, 'quo'], p: ['quae', 'quorum', 'quibus', 'quae', null, 'quibus'] },

    },

function wordAnalyses(s, i) {
  const word = s.la.replace(/_/g, ' ').split(/\s+/)[i] || '';
  const clean = word.replace(/[.,;:!?«»"]/g, '');
  if (s.words && s.words.length) {
    let w = null;
    for (const x of s.words) { const parts = x.f.split(/[_\s]+/).map((p) => E.norm(p.replace(/[.,;:!?«»"]/g, ''))); if (parts.includes(E.norm(clean))) { w = x; break; } }
    if (w) return { word: clean, ai: w, an: E.analyze(clean) };
  }
  return { word: clean, an: E.analyze(clean) };
}
function popHtml(r) {
  if (r.ai && (!r.an.length)) return `<div class="pw-lemma">${esc(r.ai.l || r.word)}</div><div class="pw-mean">${esc(r.ai.s)}</div><ul><li>${esc(r.ai.a)}</li></ul>`;
  if (r.ai && r.ai.a) return popHtml({ word: r.word, an: r.an }).replace(/<div class="pw-more">[^<]*<\/div>/, '') + `<div class="pw-more">Nel contesto: ${esc(r.ai.a)}</div>`;
  if (!r.an.length) return `<div class="pw-lemma">${esc(r.word)}</div><div class="pw-mean">Parola non presente nel lessico di base.</div>`;
  const groups = new Map();
  r.an.forEach((a) => { if (!groups.has(a.e)) groups.set(a.e, []); groups.get(a.e).push(a.d + (a.enc ? ' + -' + a.enc : '')); });
  let html = '';
  [...groups.entries()].slice(0, 3).forEach(([e, ds]) => {
    html += `<div class="pw-lemma">${esc(e.lemma)}</div><div class="pw-mean">${esc(e.it)} · ${esc(e.cls)}</div>` + (e.k === 'i' ? '' : `<ul>${uniq(ds).slice(0, 4).map((d) => '<li>' + esc(d) + '</li>').join('')}</ul>`);
  });
  if (r.an.length > 1 && !r.an.every((a) => a.e.k === 'i')) html += `<div class="pw-more">Più analisi possibili: scegli quella adatta al contesto.</div>`;
  return html;
}
function closePop() { const p = $('#pop'); if (p) p.remove(); $$('.w.open').forEach((w) => w.classList.remove('open')); }
function showWordPop(btn) {
  const open = btn.classList.contains('open');

  if (open) return;

  p.innerHTML = popHtml(r);

  p.style.left = left + 'px'; p.style.top = Math.max(16, top) + 'px';
}
function isFiniteVerb(s, i) {

function autoHint(it) {

/* ---------- Correzione ---------- */
function tilesToStr(c) { return c.chosen.map((k) => c.tiles[k]).join(' '); }
function bestItalianMatch(s, ans) {
  const refs = s.it.concat(S.extraIt[s.id] || []);
  const a = normIt(ans);
  let best = 0, bestRef = refs[0];
  for (const r of refs) { const v = simLoose(a, normIt(r)); if (v > best) { best = v; bestRef = r; } }
  return { best, bestRef };
}
function latinMultisetEqual(a, b) {
  const A = normLa(a).split(' ').filter(Boolean).sort().join(' ');
  const B = normLa(b).split(' ').filter(Boolean).sort().join(' ');
  return A === B;
}
function doCheck() {
  const c = SES.cur; if (!c || c.answered) return;
  const it = c.it;
  let res = null;
  if (it.type === 'la_it') {
    if (c.inputMode === 'tiles') {
      const built = tilesToStr(c);
      const ok = it.s.it.some((r) => normIt(r) === normIt(built));
      res = { ok, sol: it.s.it[0], given: built, near: !ok && simLoose(normIt(built), normIt(it.s.it[0])) > 0.7 };
    } else {
      const ans = $('#typed').value.trim();
      const m = bestItalianMatch(it.s, ans);
      if (m.best >= 0.88) res = { ok: true, sol: m.bestRef, given: ans, typed: true, note: m.best < 0.995 && normIt(ans) !== normIt(m.bestRef) ? 'Versione di riferimento: ' + m.bestRef : '' };
      else return pendingTyped(it, ans, m);
    }
  } else if (it.type === 'it_la') {
    if (c.inputMode === 'tiles') {
      const built = tilesToStr(c);
      const ok = latinMultisetEqual(built, it.s.la);
      const sameOrder = normLa(built) === normLa(it.s.la);
      res = { ok, sol: it.s.la.replace(/_/g, ' '), given: built.replace(/_/g, ' '), latin: true, note: ok && !sameOrder ? 'Corretto: in latino l’ordine è libero. Ordine classico: ' + it.s.la.replace(/_/g, ' ') : '' };
    } else {
      const ans = $('#typed').value.trim();
      if (latinMultisetEqual(ans, it.s.la)) res = { ok: true, sol: it.s.la.replace(/_/g, ' '), given: ans, latin: true, typed: true };
      else return pendingTyped(it, ans, null);
    }
  } else if (it.type === 'analizza') {
    const o = it.options[c.picked];
    const ok = it.valid.includes(o);
    res = { ok, sol: it.correct, others: it.valid.length > 1 ? it.valid : null, forms: true };
    markOptions(ok, (k) => it.valid.includes(it.options[k]));
  } else if (it.type === 'paradigma') {
    const ans = E.norm($('#typed').value.trim());
    const ok = it.answers.some((a) => E.norm(a) === ans);
    res = { ok, sol: it.answers.join(' / '), latin: true, forms: true };
  } else if (it.type === 'completa') {
    const ok = E.norm(it.options[c.picked]) === E.norm(it.answer);
    res = { ok, sol: it.s.la.replace(/_/g, ' '), latin: true };
    markOptions(ok, (k) => E.norm(it.options[k]) === E.norm(it.answer));
    const b = $('#blank'); if (b) b.textContent = it.answer;
  } else if (it.type === 'lessico') {
    const ok = it.options[c.picked] === it.e;
    res = { ok, sol: it.e.lemma + ' = ' + it.e.it };
    markOptions(ok, (k) => it.options[k] === it.e);
    const v = S.vocab[it.e.lemma] || { box: 0, due: dayKey() };
    if (ok) v.box = Math.min(5, v.box + 1); else v.box = 0;
    S.vocab[it.e.lemma] = v;
  }
  finalize(res);
}
function markOptions(ok, isRight) {
  $$('#ovBody .opt').forEach((b, k) => {
    b.disabled = true;
    if (isRight(k)) b.classList.add('right');
    else if (+k === SES.cur.picked && !ok) b.classList.add('wrong');
  });
}
function pendingTyped(it, ans, match) {
  const c = SES.cur; c.answered = true;
  $('#typed').readOnly = true;
  $$('#ovBody .tool').forEach((b) => (b.disabled = true));
  const latin = it.type === 'it_la';

  if (aiUsable()) {
    $('#ovFoot').innerHTML = thinking('Il magister sta leggendo la tua traduzione…');
    aiCorrect(it.s, ans, it.type).then((r) => {
      if (!SES || SES.cur !== c) return;
      const esito = String(r.esito).toLowerCase();
      const ok = esito.startsWith('corrett') || esito.startsWith('accettab');
      finalize({ ok, partial: esito.startsWith('accettab'), sol: r.proposta || sol, latin, given: ans, typed: true, ai: r }, true);
    }).catch((e) => {

}

const PRAISE = ['Optime!', 'Bene!', 'Recte!', 'Euge!', 'Macte!'];

function laurelSvg() {
  const cx = 60, cy = 50, R = 36;
  let leaves = '', stem = '';
  for (const side of [-1, 1]) {
    const pts = [];
    for (let k = 0; k <= 9; k++) {
      const th = (side < 0 ? 105 + k * 15 : 75 - k * 15) * Math.PI / 180;
      pts.push([cx + R * Math.cos(th), cy + R * Math.sin(th), th]);
    }
    stem += `<path d="M${pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L')}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`;
    pts.slice(1).forEach(([x, y, th], k) => {
      const deg = th * 180 / Math.PI;
      for (const o of [1, -1]) {
        const lx = x + o * 6 * Math.cos(th), ly = y + o * 6 * Math.sin(th);
        const rot = deg + o * side * 35;
        leaves += `<ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="3.6" ry="8" transform="rotate(${rot.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})" fill="currentColor" opacity="${(0.62 + k * 0.04).toFixed(2)}"/>`;
      }
    });
  }
  return `<svg class="laurel" viewBox="0 0 120 100" aria-hidden="true">${stem}${leaves}</svg>`;
}

  if (v) { rec.box = Math.min(5, rec.box + 1); rec.due = addDays(today, BOX_DAYS[rec.box]); addXP(1); }
  else { rec.box = 1; rec.due = today; f.list.push(e); }
  S.vocab[e.lemma] = rec;
  f.i++; f.show = false;
  checkBadges().forEach((b) => toast('Nuova insegna: ' + b.name));
  save(); render();
}

/* ---------- Ego ---------- */
function weekSvg() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(dayKey(), i - 6));
  const vals = days.map((d) => S.days[d] || 0);
  const max = Math.max(S.goal, ...vals) * 1.15;
  const W = 320, H = 130, top = 12, bottom = 104, bw = 26;
  const y = (v) => bottom - (v / max) * (bottom - top);
  const names = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP degli ultimi sette giorni">`;
  s += `<line x1="8" x2="${W - 8}" y1="${y(S.goal).toFixed(1)}" y2="${y(S.goal).toFixed(1)}" stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  s += `<text x="8" y="${(y(S.goal) - 5).toFixed(1)}" text-anchor="start" font-size="10" fill="var(--gold)">obiettivo ${S.goal} XP</text>`;
  days.forEach((d, i) => {
    const cx = 24 + i * ((W - 48) / 6), v = vals[i], yy = y(v);
    const isToday = i === 6;
    s += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw}" height="${Math.max(0, bottom - yy).toFixed(1)}" rx="6" fill="${v >= S.goal ? 'var(--ok)' : isToday ? 'var(--accent)' : 'var(--line-strong)'}"/>`;
    if (v) s += `<text x="${cx.toFixed(1)}" y="${(yy - 4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">${v}</text>`;
    const [yr, mo, da] = d.split('-').map(Number);
    s += `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${isToday ? 'var(--accent)' : 'var(--muted)'}" font-weight="${isToday ? 700 : 400}">${names[new Date(yr, mo - 1, da).getDay()]}</text>`;
  });
  return s + `<line x1="8" x2="${W - 8}" y1="${bottom}" y2="${bottom}" stroke="var(--line)"/></svg>`;
}

  b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="iconbtn" data-act="closeSheet" aria-label="Chiudi">${I.close}</button></div><div class="sheet-body">${html}</div></div>`;

}
function closeSheet() { const s = $('#sheet'); if (s) { if (s._ctl) s._ctl.abort(); s.remove(); } }
function showModal(html) {
  const b = document.createElement('div'); b.className = 'sheet-back center'; b.id = 'modal';
  b.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(b);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function analysisSheet(s) {
  const words = s.la.replace(/_/g, ' ').split(/\s+/);
  const wkLink = (r) => {
    if (!DICT.enabled()) return '';
    const head = r.an[0] ? r.an[0].e.head : r.word;
    const title = E.norm(head.split(',')[0]).trim();
    return title ? `<a class="wk-link" href="${DICT.pageUrl('it', title)}" target="_blank" rel="noopener">Wikizionario: ${esc(title)}</a>` : '';
  };
  const html = `<div class="analysis">${words.map((w, i) => { const r = wordAnalyses(s, i); return `<div class="an-item"><div class="an-lemma" lang="la">${esc(r.word)}</div>${popHtml(r).replace(/pw-lemma/g, 'an-mean').replace(/pw-mean/g, 'an-mean').replace(/pw-more/g, 'note')}${wkLink(r)}</div>`; }).join('')}</div><p class="note">Traduzione: ${esc(s.it[0])}</p>`;
  openSheet('Analisi parola per parola', html);
}
function explainSheet(s) {
  const sh = openSheet('Spiegazione del magister', `<div class="ai-out" id="explOut">${thinking('Il magister sta preparando la spiegazione…')}</div>`);
  const ctl = new AbortController(); sh._ctl = ctl;
  aiExplain(s, ({ text }) => { const o = $('#explOut'); if (o) o.innerHTML = mdLite(text); }, ctl.signal)
    .then((r) => { const o = $('#explOut'); if (o) o.innerHTML = mdLite(r.text); })
    .catch((e) => { const msg = aiFail(e); const o = $('#explOut'); if (o && msg) o.innerHTML = `<p>${esc(msg)}</p>`; });
}
function askMagister(id) {
  const q = ($('#askQ') || {}).value || '';
  if (!q.trim()) { toast('Scrivi prima la domanda.'); return; }
  const out = $('#askOut'); out.innerHTML = `<div class="ai-out">${thinking('Il magister sta rispondendo…')}</div>`;
  aiAsk(id, q.trim(), ({ text }) => { out.innerHTML = `<div class="ai-out">${mdLite(text)}</div>`; })
    .then((r) => { out.innerHTML = `<div class="ai-out">${mdLite(r.text)}</div>`; })
    .catch((e) => { const msg = aiFail(e); out.innerHTML = msg ? `<p class="note">${esc(msg)}</p>` : ''; });
}

  topic: (el) => { UI.tab = 'bibliotheca'; UI.topic = el.dataset.t; UI.method = false; render(); window.scrollTo(0, 0); },

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) { if (!e.target.closest('#pop')) closePop(); return; }
  const fn = ACT[el.dataset.act];
  if (el.dataset.act !== 'word') closePop();
  if (fn) fn(el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#pop')) closePop(); else if ($('#modal')) closeModal(); else if ($('#sheet')) closeSheet(); }
  if (!SES || !$('#ov')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') {
    if (e.key === 'Enter' && e.target.id === 'typed' && e.target.tagName === 'INPUT') { e.preventDefault(); const b = $('#checkBtn'); if (b && !b.disabled) doCheck(); else { const n = $('#nextBtn'); if (n) nextItem(); } }
    return;
  }
  if (e.key === 'Enter') {
    const n = $('#nextBtn'); if (n && document.activeElement !== n) { e.preventDefault(); nextItem(); return; }
    const b = $('#checkBtn'); if (b && !b.disabled && document.activeElement === document.body) { e.preventDefault(); doCheck(); }
  }
  if (/^[1-4]$/.test(e.key)) { const opts = $$('#ovBody .opt'); const o = opts[+e.key - 1]; if (o && !o.disabled) o.click(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'typed' && e.target.tagName === 'INPUT') { const b = $('#checkBtn'); if (b) b.disabled = !e.target.value.trim(); }
});

/* ---------- Avvio ---------- */
function boot() {
  load();
  const h = (location.hash || '').replace('#', '');
  if (['domus', 'bibliotheca', 'verba', 'ego'].includes(h)) UI.tab = h;
  render();
  if (!S.onboarded) startOnboarding();
  initAI();
}
boot();

</script>
