/* VERTO — stile. Ogni misura viene dai gettoni qui sotto (docs/sistema-design.md): un valore scritto a mano è un errore.
   Spazi a base 4 · 7 dimensioni di testo · 3 raggi · 3 altezze dei controlli · un solo rilievo per pulsanti e tessere. */
:root {
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 48px;
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 40px;
  --lh: 1.5; --lh-tight: 1.2;
  --r-sm: 8px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px;
  --h-sm: 40px; --h-md: 48px; --h-lg: 56px;
  --depth: 4px;
  --ic-xs: 16px; --ic-sm: 20px; --ic-md: 24px; --ic-lg: 32px; --ic-xl: 40px;
  --thumb: #FFFFFF; --veil: rgb(10 12 16 / .48); --on-color-line: rgb(255 255 255 / .45); --on-color-hover: rgb(255 255 255 / .16);
  --w-main: 600px; --w-lesson: 640px; --w-side: 320px; --w-rail: 232px;
  --f-ui: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-la: 'Gentium Book Plus', 'Gentium Plus', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --f-display: 'Marcellus', 'Trajan Pro', Georgia, serif;
  --sh-float: 0 10px 40px rgb(20 24 30 / .22);
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 var(--fs-md) / var(--lh) var(--f-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-wrap: break-word; hyphens: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--fs-2xl); line-height: var(--lh-tight); font-weight: 700; }
h2 { font-size: var(--fs-xl); line-height: var(--lh-tight); font-weight: 700; }
h3 { font-size: var(--fs-lg); line-height: var(--lh-tight); font-weight: 600; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--pri-text); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: var(--sp-3); color: var(--muted); }
.splash .mark { width: var(--h-lg); height: var(--h-lg); }
.splash b { font-family: var(--f-display); font-weight: 400; font-size: var(--fs-2xl); letter-spacing: .14em; color: var(--ink); }
.noscript { padding: var(--sp-5); }
.skip { position: absolute; left: var(--sp-2); top: var(--sp-2); z-index: 100; transform: translateY(-200%); background: var(--surface); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); }
.skip:focus { transform: none; }
.la { font-family: var(--f-la); font-style: italic; }
.la.up { font-style: normal; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: var(--fs-sm); }
.nowrap { white-space: nowrap; }
.stack { display: grid; gap: var(--sp-3); }
.stack-lg { display: grid; gap: var(--sp-5); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.grow { flex: 1; min-width: 0; }
svg { flex: none; }
/* un'icona senza misura propria prende quella piccola (specificità zero: ogni regola dei componenti vince) */
:where(svg:not([width])) { width: var(--ic-sm); height: var(--ic-sm); }

/* ---------- Guscio: barra in alto, colonna, menu laterale e pannello su computer ---------- */
.shell { min-height: 100vh; }
.main { max-width: var(--w-main); margin: 0 auto; padding: 0 max(var(--sp-4), env(safe-area-inset-right, 0px)) calc(88px + env(safe-area-inset-bottom, 0px)) max(var(--sp-4), env(safe-area-inset-left, 0px)); outline: none; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }

<script>
/* ---- src/engine.js ---- */
/* VERTO — motore morfologico latino (biennio).
   Genera tutte le forme dal paradigma e costruisce un indice forma → analisi.
   Ogni analisi porta gli argomenti di programma necessari per riconoscerla (req).
   Il lessico e le desinenze sono scritti con le quantità (ā ē ī ō ū): ogni forma ha la grafia
   con le quantità (q) e quella scolastica senza segni (f), che è quella usata per riconoscere le parole.
   Chiavi delle forme: n:caso:numero · a:grado:caso:numero:genere · v:modo:tempo:diatesi:persona
   (infinito v:inf:tempo:diatesi, participio v:part:tempo:caso:numero:genere) · p:caso:numero:genere · i */
(function (root) {
  'use strict';

  const CASES = ['nom', 'gen', 'dat', 'acc', 'voc', 'abl'];
  const CASE_IT = { nom: 'nominativo', gen: 'genitivo', dat: 'dativo', acc: 'accusativo', voc: 'vocativo', abl: 'ablativo', loc: 'locativo' };
  const NUM_IT = { s: 'singolare', p: 'plurale' };
  const GEN_IT = { m: 'maschile', f: 'femminile', n: 'neutro' };
  const PERS = ['1ª pers. sing.', '2ª pers. sing.', '3ª pers. sing.', '1ª pers. plur.', '2ª pers. plur.', '3ª pers. plur.'];
  const TENSE_IT = { pres: 'presente', impf: 'imperfetto', fut: 'futuro semplice', perf: 'perfetto', ppf: 'piuccheperfetto', futant: 'futuro anteriore' };

  /* ---------- Grafia ---------- */
  const LONG = { 'ā': 'a', 'ē': 'e', 'ī': 'i', 'ō': 'o', 'ū': 'u', 'ȳ': 'y', 'Ā': 'A', 'Ē': 'E', 'Ī': 'I', 'Ō': 'O', 'Ū': 'U', 'Ȳ': 'Y', 'ă': 'a', 'ĕ': 'e', 'ĭ': 'i', 'ŏ': 'o', 'ŭ': 'u', 'Ă': 'A', 'Ĕ': 'E', 'Ĭ': 'I', 'Ŏ': 'O', 'Ŭ': 'U' };
  // toglie i segni di quantità lasciando invariata la lunghezza della stringa
  const plain = (s) => String(s).replace(/[āēīōūȳĀĒĪŌŪȲăĕĭŏŭĂĔĬŎŬ]/g, (c) => LONG[c]);
  function norm(w) {
    return String(w).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/j/g, 'i');
  }
  function syl(w) { return (norm(w).match(/ae|au|oe|[aeiouy]/g) || []).length; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  const isCons = (ch) => ch && !'aeiouy'.includes(ch);
  // le prove sulle desinenze si fanno sulla grafia senza segni; i temi si tagliano dalla grafia con le quantità
  const ends = (s, e) => plain(s).endsWith(e);

  /* ---------- Nomi ---------- */
  const D1 = { s: ['a', 'ae', 'ae', 'am', 'a', 'ā'], p: ['ae', 'ārum', 'īs', 'ās', 'ae', 'īs'] };
  const D2M = { s: ['us', 'ī', 'ō', 'um', 'e', 'ō'], p: ['ī', 'ōrum', 'īs', 'ōs', 'ī', 'īs'] };
  const D2N = { s: ['um', 'ī', 'ō', 'um', 'um', 'ō'], p: ['a', 'ōrum', 'īs', 'a', 'a', 'īs'] };
  const D4M = { s: ['us', 'ūs', 'uī', 'um', 'us', 'ū'], p: ['ūs', 'uum', 'ibus', 'ūs', 'ūs', 'ibus'] };
  const D4N = { s: ['ū', 'ūs', 'ū', 'ū', 'ū', 'ū'], p: ['ua', 'uum', 'ibus', 'ua', 'ua', 'ibus'] };
  const D5 = { s: ['ēs', 'eī', 'eī', 'em', 'ēs', 'ē'], p: ['ēs', 'ērum', 'ēbus', 'ēs', 'ēs', 'ēbus'] };
  const GP_UM = ['pater', 'mater', 'frater', 'iuvenis', 'canis', 'senex', 'accipiter', 'vates'];

  function nounInfo(e) {
    const { nom, gen } = e;
    if (e.pl) {
      if (ends(gen, 'arum')) return { d: 1, stem: gen.slice(0, -4) };
      if (ends(gen, 'orum')) return { d: 2, stem: gen.slice(0, -4) };
      if (ends(gen, 'uum')) return { d: 4, stem: gen.slice(0, -3) };
      if (ends(gen, 'ium')) return { d: 3, stem: gen.slice(0, -3), gp: 'ium' };
      return { d: 3, stem: gen.slice(0, -2), gp: 'um' };
    }
    if (ends(gen, 'ae')) return { d: 1, stem: gen.slice(0, -2) };
    if (ends(gen, 'ei') && ends(nom, 'es')) return { d: 5, stem: gen.slice(0, -2) };
    if (ends(gen, 'i')) return { d: 2, stem: gen.slice(0, -1) };
    if (ends(gen, 'us')) return { d: 4, stem: gen.slice(0, -2) };
    if (ends(gen, 'is')) return { d: 3, stem: gen.slice(0, -2) };
    throw new Error('Nome non riconosciuto: ' + nom);
  }

  function nounForms(e) {
    const inf = nounInfo(e);
    const { d, stem } = inf;
    const g = e.g;
    const out = []; // {f, c, n}
    const push = (f, c, n) => out.push({ f, c, n });
    let tab;
    if (d === 1) tab = D1;
    else if (d === 2) tab = g === 'n' ? D2N : D2M;
    else if (d === 4) tab = g === 'n' ? D4N : D4M;
    else if (d === 5) {
      // dopo vocale il genitivo e il dativo singolare sono in -ēī (diēī), dopo consonante in -eī (reī)
      tab = /[aeiou]$/.test(plain(stem)) ? { s: ['ēs', 'ēī', 'ēī', 'em', 'ēs', 'ē'], p: D5.p } : D5;
    }
    if (e.only) return { info: inf, forms: (e.extra || []).map((x) => ({ f: x.f, c: x.c, n: x.n })) };
    if (d === 3) {
      let gp = e.gp || inf.gp;
      const nomN = norm(e.nom);
      const neutI = g === 'n' && (/(e|al|ar)$/.test(nomN) || (e.pl && gp === 'ium'));
      if (!gp) {
        if (neutI) gp = 'ium';
        else if (GP_UM.includes(nomN)) gp = 'um';
        else if (g !== 'n' && syl(e.nom) === syl(e.gen) && /(is|es)$/.test(nomN)) gp = 'ium';
        else if (syl(e.nom) === 1 && /[sx]$/.test(nomN) && isCons(plain(stem).slice(-1)) && isCons(plain(stem).slice(-2, -1))) gp = 'ium';
        else gp = 'um';
      }
      const ablS = neutI ? 'ī' : 'e';
      const plN = neutI ? 'ia' : 'a';
      if (!e.pl) {
        if (g === 'n') {
          [e.nom, stem + 'is', stem + 'ī', e.nom, e.nom, stem + ablS].forEach((f, i) => push(f, CASES[i], 's'));
        } else {
          [e.nom, stem + 'is', stem + 'ī', stem + 'em', e.nom, stem + ablS].forEach((f, i) => push(f, CASES[i], 's'));
        }
        if (e.ablI) push(stem + 'ī', 'abl', 's');
      }
      if (!e.sg) {
        if (g === 'n') [stem + plN, stem + gp, stem + 'ibus', stem + plN, stem + plN, stem + 'ibus'].forEach((f, i) => push(f, CASES[i], 'p'));
        else [stem + 'ēs', stem + gp, stem + 'ibus', stem + 'ēs', stem + 'ēs', stem + 'ibus'].forEach((f, i) => push(f, CASES[i], 'p'));
      }
    } else {
      if (!e.pl) {
        tab.s.forEach((end, i) => {
          let f = stem + end;
          if (i === 0) f = e.nom;
          if (d === 2 && g !== 'n') {
            if (i === 4) {
              if (!ends(e.nom, 'us')) f = e.nom;
              // vocativo in -ī solo dove il lessico lo dichiara (fīlius e i nomi propri latini in -ius); gli altri in -ie: socie, nūntie
              else if (ends(e.nom, 'ius') && e.vocI) f = e.nom.slice(0, -3) + 'ī';
            }
          }
          if (d === 1 && i === 4 && !ends(e.nom, 'a')) f = stem + 'a';
          push(f, CASES[i], 's');
        });
      }
      if (!e.sg) tab.p.forEach((end, i) => push(stem + end, CASES[i], 'p'));
      if (e.abus && !e.sg) { push(stem + 'ābus', 'dat', 'p'); push(stem + 'ābus', 'abl', 'p'); }
    }
    if (e.extra) e.extra.forEach((x) => push(x.f, x.c, x.n));
    if (e.loc) push(e.loc, 'loc', e.pl ? 'p' : 's');
    const drop = (e.drop || []).map(plain);
    return { info: inf, forms: out.filter((x) => !drop.includes(plain(x.f))) };
  }

  /* ---------- Aggettivi ---------- */
  function adjInfo(a) {
    // a.parts = [m, f, n] oppure [m, gen] ecc.
    const [p1, p2, p3] = a.parts;
    if (p2 && ends(p2, 'a') && p3 && ends(p3, 'um')) return { cls: 1, stem: p2.slice(0, -1), m: p1 };
    if (p2 && ends(p2, 'is') && p3 && ends(p3, 'e')) return { cls: 2, kind: 3, stem: p3.slice(0, -1), m: p1, f: p2, n: p3 };
    if (p2 && ends(p2, 'e') && ends(p1, 'is')) return { cls: 2, kind: 2, stem: p1.slice(0, -2), m: p1, f: p1, n: p2 };
    if (p2 && ends(p2, 'is')) return { cls: 2, kind: 1, stem: p2.slice(0, -2), m: p1, f: p1, n: p1 };
    throw new Error('Aggettivo non riconosciuto: ' + a.parts.join(','));
  }

  // restituisce [{f,c,n,g}]
  function decl1Adj(mNom, stem, opts = {}) {
    const out = [];
    const pron = opts.pron;
    const mEnd = ends(mNom, 'us');
    D2M.s.forEach((end, i) => {
      let f = stem + end;
      if (i === 0) f = mNom;
      if (i === 4) f = mEnd ? (opts.vocMi ? 'mī' : stem + 'e') : mNom;
      if (pron && i === 1) f = stem + 'īus';
      if (pron && i === 2) f = stem + 'ī';
      out.push({ f, c: CASES[i], n: 's', g: 'm' });
    });
    D1.s.forEach((end, i) => {
      let f = stem + end;
      if (pron && i === 1) f = stem + 'īus';
      if (pron && i === 2) f = stem + 'ī';
      out.push({ f, c: CASES[i], n: 's', g: 'f' });
    });
    D2N.s.forEach((end, i) => {
      let f = stem + end;
      if (pron && i === 1) f = stem + 'īus';
      if (pron && i === 2) f = stem + 'ī';
      if (opts.neutD && (i === 0 || i === 3 || i === 4)) f = opts.neutD;
      out.push({ f, c: CASES[i], n: 's', g: 'n' });
    });
    D2M.p.forEach((end, i) => out.push({ f: stem + end, c: CASES[i], n: 'p', g: 'm' }));
    D1.p.forEach((end, i) => out.push({ f: stem + end, c: CASES[i], n: 'p', g: 'f' }));
    D2N.p.forEach((end, i) => out.push({ f: stem + end, c: CASES[i], n: 'p', g: 'n' }));
    if (pron) return out.filter((x) => x.c !== 'voc');
    return out;
  }

  function decl3Adj(nomM, nomF, nomN, stem, iStem = true, ablE = false) {
    const out = [];
    const abl = iStem && !ablE ? 'ī' : 'e';
    const gp = iStem ? 'ium' : 'um';
    const npl = iStem ? 'ia' : 'a';
    for (const [g, nom] of [['m', nomM], ['f', nomF]]) {
      [nom, stem + 'is', stem + 'ī', stem + 'em', nom, stem + abl].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g }));
      if (ablE && iStem) out.push({ f: stem + 'ī', c: 'abl', n: 's', g });
      [stem + 'ēs', stem + gp, stem + 'ibus', stem + 'ēs', stem + 'ēs', stem + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g }));
    }
    [nomN, stem + 'is', stem + 'ī', nomN, nomN, stem + abl].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g: 'n' }));
    if (ablE && iStem) out.push({ f: stem + 'ī', c: 'abl', n: 's', g: 'n' });
    [stem + npl, stem + gp, stem + 'ibus', stem + npl, stem + npl, stem + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g: 'n' }));
    return out;
  }

  // comparativo: maschile e femminile in -ior, neutro in -ius, tema obliquo in -iōr- (altior, altius, altiōris)
  function comparativeForms(m, n, st) {
    const out = [];
    for (const g of ['m', 'f']) {
      [m, st + 'is', st + 'ī', st + 'em', m, st + 'e'].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g }));
      [st + 'ēs', st + 'um', st + 'ibus', st + 'ēs', st + 'ēs', st + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g }));
    }
    [n, st + 'is', st + 'ī', n, n, st + 'e'].forEach((f, i) => out.push({ f, c: CASES[i], n: 's', g: 'n' }));
    [st + 'a', st + 'um', st + 'ibus', st + 'a', st + 'a', st + 'ibus'].forEach((f, i) => out.push({ f, c: CASES[i], n: 'p', g: 'n' }));
    return out;
  }

  // irregolari: [maschile, neutro, tema obliquo, superlativo]
  const COMP_IRR = {
    bonus: ['melior', 'melius', 'meliōr', 'optimus'], malus: ['pēior', 'pēius', 'pēiōr', 'pessimus'], magnus: ['māior', 'māius', 'māiōr', 'maximus'],
    parvus: ['minor', 'minus', 'minōr', 'minimus'], multus: [null, null, null, 'plūrimus'],
  };
  const ILLIMUS = ['facilis', 'difficilis', 'similis', 'dissimilis', 'humilis', 'gracilis'];

  function adjForms(a) {
    const info = adjInfo(a);
    let pos;
    if (info.cls === 1) pos = decl1Adj(info.m, info.stem, { pron: a.pron, vocMi: a.vocMi, neutD: a.neutD });
    else pos = decl3Adj(info.m, info.f, info.n, info.stem, !a.cons, false);
    if (a.extra) a.extra.forEach((x) => pos.push(x));
    const res = pos.map((x) => ({ ...x, deg: 'pos' }));
    if (!a.nocomp && !a.pron) {
      const irr = COMP_IRR[norm(info.m)];
      let sup;
      if (irr) {
        sup = irr[3];
        if (irr[0]) comparativeForms(irr[0], irr[1], irr[2]).forEach((x) => res.push({ ...x, deg: 'comp' }));
      } else {
        const st = info.stem;
        if (norm(info.m).endsWith('er')) sup = info.m + 'rimus';
        else if (ILLIMUS.includes(norm(info.m))) sup = st + 'limus';
        else sup = st + 'issimus';
        comparativeForms(st + 'ior', st + 'ius', st + 'iōr').forEach((x) => res.push({ ...x, deg: 'comp' }));
      }
      if (norm(info.m) === 'multus') {
        [['plūs', 'nom', 's', 'n'], ['plūris', 'gen', 's', 'n'], ['plūs', 'acc', 's', 'n'], ['plūre', 'abl', 's', 'n']].forEach(([f, c, n, g]) => res.push({ f, c, n, g, deg: 'comp' }));
        for (const g of ['m', 'f']) [['plūrēs', 'nom'], ['plūrium', 'gen'], ['plūribus', 'dat'], ['plūrēs', 'acc'], ['plūribus', 'abl']].forEach(([f, c]) => res.push({ f, c, n: 'p', g, deg: 'comp' }));
        [['plūra', 'nom'], ['plūrium', 'gen'], ['plūribus', 'dat'], ['plūra', 'acc'], ['plūribus', 'abl']].forEach(([f, c]) => res.push({ f, c, n: 'p', g: 'n', deg: 'comp' }));
      }
      decl1Adj(sup, sup.slice(0, -2)).forEach((x) => res.push({ ...x, deg: 'sup' }));
    }
    return { info, forms: res };
  }

  /* ---------- Verbi ---------- */
  const PRES_ACT = { 1: ['ō', 'ās', 'at', 'āmus', 'ātis', 'ant'], 2: ['eō', 'ēs', 'et', 'ēmus', 'ētis', 'ent'], 3: ['ō', 'is', 'it', 'imus', 'itis', 'unt'], 4: ['iō', 'īs', 'it', 'īmus', 'ītis', 'iunt'], 5: ['iō', 'is', 'it', 'imus', 'itis', 'iunt'] };
  const PRES_PASS = { 1: ['or', 'āris', 'ātur', 'āmur', 'āminī', 'antur'], 2: ['eor', 'ēris', 'ētur', 'ēmur', 'ēminī', 'entur'], 3: ['or', 'eris', 'itur', 'imur', 'iminī', 'untur'], 4: ['ior', 'īris', 'ītur', 'īmur', 'īminī', 'iuntur'], 5: ['ior', 'eris', 'itur', 'imur', 'iminī', 'iuntur'] };
  const IMPF_V = { 1: 'ā', 2: 'ē', 3: 'ē', 4: 'iē', 5: 'iē' };
  const BA_ACT = ['bam', 'bās', 'bat', 'bāmus', 'bātis', 'bant'];
  const BA_PASS = ['bar', 'bāris', 'bātur', 'bāmur', 'bāminī', 'bantur'];
  const FUT_ACT = { 1: ['ābō', 'ābis', 'ābit', 'ābimus', 'ābitis', 'ābunt'], 2: ['ēbō', 'ēbis', 'ēbit', 'ēbimus', 'ēbitis', 'ēbunt'], 3: ['am', 'ēs', 'et', 'ēmus', 'ētis', 'ent'], 4: ['iam', 'iēs', 'iet', 'iēmus', 'iētis', 'ient'], 5: ['iam', 'iēs', 'iet', 'iēmus', 'iētis', 'ient'] };
  const FUT_PASS = { 1: ['ābor', 'āberis', 'ābitur', 'ābimur', 'ābiminī', 'ābuntur'], 2: ['ēbor', 'ēberis', 'ēbitur', 'ēbimur', 'ēbiminī', 'ēbuntur'], 3: ['ar', 'ēris', 'ētur', 'ēmur', 'ēminī', 'entur'], 4: ['iar', 'iēris', 'iētur', 'iēmur', 'iēminī', 'ientur'], 5: ['iar', 'iēris', 'iētur', 'iēmur', 'iēminī', 'ientur'] };
  // congiuntivo presente: vocale breve davanti a -m, -t, -nt, -r; lunga altrove (amem, amēs, amet)
  const SUBJ_S = { 1: 'e', 2: 'ea', 3: 'a', 4: 'ia', 5: 'ia' };
  const SUBJ_L = { 1: 'ē', 2: 'eā', 3: 'ā', 4: 'iā', 5: 'iā' };
  const subjAct = (k) => [SUBJ_S[k] + 'm', SUBJ_L[k] + 's', SUBJ_S[k] + 't', SUBJ_L[k] + 'mus', SUBJ_L[k] + 'tis', SUBJ_S[k] + 'nt'];
  const subjPass = (k) => [SUBJ_S[k] + 'r', SUBJ_L[k] + 'ris', SUBJ_L[k] + 'tur', SUBJ_L[k] + 'mur', SUBJ_L[k] + 'minī', SUBJ_S[k] + 'ntur'];
  // congiuntivo imperfetto: infinito senza la -e finale + desinenze (amār-em, amār-ēs)
  const SIMPF_ACT = ['em', 'ēs', 'et', 'ēmus', 'ētis', 'ent'];
  const SIMPF_PASS = ['er', 'ēris', 'ētur', 'ēmur', 'ēminī', 'entur'];
  const IMPER = { 1: ['ā', 'āte'], 2: ['ē', 'ēte'], 3: ['e', 'ite'], 4: ['ī', 'īte'], 5: ['e', 'ite'] };
  const IMPER_P = { 1: ['āre', 'āminī'], 2: ['ēre', 'ēminī'], 3: ['ere', 'iminī'], 4: ['īre', 'īminī'], 5: ['ere', 'iminī'] };
  const INF_PASS = { 1: 'ārī', 2: 'ērī', 3: 'ī', 4: 'īrī', 5: 'ī' };
  const INF_ACT = { 1: 'āre', 2: 'ēre', 3: 'ere', 4: 'īre', 5: 'ere' };
  const PART_PRES = { 1: ['āns', 'ant'], 2: ['ēns', 'ent'], 3: ['ēns', 'ent'], 4: ['iēns', 'ient'], 5: ['iēns', 'ient'] };
  const PERF_E = ['ī', 'istī', 'it', 'imus', 'istis', 'ērunt'];
  const PPF_E = ['eram', 'erās', 'erat', 'erāmus', 'erātis', 'erant'];
  const FUTANT_E = ['erō', 'eris', 'erit', 'erimus', 'eritis', 'erint'];
  const SPERF_E = ['erim', 'erīs', 'erit', 'erīmus', 'erītis', 'erint'];
  const SPPF_E = ['issem', 'issēs', 'isset', 'issēmus', 'issētis', 'issent'];

  function conjOf(pres, inf) {
    if (ends(inf, 'are')) return 1;
    if (ends(inf, 'ire')) return 4;
    if (ends(pres, 'eo')) return 2;
    if (ends(pres, 'io')) return 5;
    return 3;
  }
  function depConjOf(pres, inf) {
    if (ends(inf, 'ari')) return [1, inf.slice(0, -3)];
    if (ends(inf, 'eri') && ends(pres, 'eor')) return [2, inf.slice(0, -3)];
    if (ends(inf, 'iri')) return [4, inf.slice(0, -3)];
    if (ends(pres, 'ior')) return [5, inf.slice(0, -1)];
    return [3, inf.slice(0, -1)];
  }

  // costruttore di forme verbali: aggiunge gli argomenti necessari a riconoscerle
  function VF(list, base) {
    return function add(f, mood, tense, voice, p, extraReq, extra) {
      if (!f) return;
      const req = new Set([base]);
      if (mood === 'ind' && (tense === 'impf' || tense === 'fut')) req.add('v_if');
      if (['perf', 'ppf', 'futant'].includes(tense)) req.add('v_perf');
      if (mood === 'cong') req.add('v_cong');
      if (mood === 'imp') req.add('v_imper');
      if (voice === 'pass' && base !== 'v_dep') req.add('v_pass');
      (extraReq || []).forEach((r) => req.add(r));
      list.push({ f, mood, tense, voice: voice || 'act', p, req: [...req], ...(extra || {}) });
    };
  }

  function participleDecl(add, nom, stem, kind) {
    // kind: 'pres' (amāns, amantis), 'perf', 'fut'
    if (kind === 'pres') {
      decl3Adj(nom, nom, nom, stem, true, true).forEach((x) => add(x.f, 'part', 'pres', null, null, ['v_part'], { c: x.c, n: x.n, g: x.g }));
    } else {
      const st = nom.slice(0, -2);
      decl1Adj(nom, st).forEach((x) => {
        if (x.c === 'voc') return;
        const req = kind === 'perf' && (x.c === 'nom') ? ['v_perf'] : ['v_part'];
        add(x.f, 'part', kind, null, null, req, { c: x.c, n: x.n, g: x.g });
      });
    }
  }

  function regularVerbForms(v) {
    const list = [];
    const base = v.t || 'v_pres';
    const add = VF(list, base);
    const k = conjOf(v.pres, v.inf);
    const R = v.inf.slice(0, -3);
    const SI = v.inf.slice(0, -1);
    PRES_ACT[k].forEach((e, i) => add(i === 0 ? v.pres : R + e, 'ind', 'pres', 'act', i));
    BA_ACT.forEach((e, i) => add(R + IMPF_V[k] + e, 'ind', 'impf', 'act', i));
    FUT_ACT[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'act', i));
    add(v.imp || R + IMPER[k][0], 'imp', 'pres', 'act', 1);
    add(R + IMPER[k][1], 'imp', 'pres', 'act', 4);
    add(v.inf, 'inf', 'pres', 'act', null);
    subjAct(k).forEach((e, i) => add(R + e, 'cong', 'pres', 'act', i));
    SIMPF_ACT.forEach((e, i) => add(SI + e, 'cong', 'impf', 'act', i));
    if (!v.intr) {
      PRES_PASS[k].forEach((e, i) => add(R + e, 'ind', 'pres', 'pass', i));
      BA_PASS.forEach((e, i) => add(R + IMPF_V[k] + e, 'ind', 'impf', 'pass', i));
      FUT_PASS[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'pass', i));
      add(R + INF_PASS[k], 'inf', 'pres', 'pass', null);
      subjPass(k).forEach((e, i) => add(R + e, 'cong', 'pres', 'pass', i));
      SIMPF_PASS.forEach((e, i) => add(SI + e, 'cong', 'impf', 'pass', i));
    }
    const [ps, pt] = PART_PRES[k];
    participleDecl(add, R + ps, R + pt, 'pres');
    perfectSystem(add, v);
    // dō ha la a breve fuori da dās e dā (damus, dabam, dare)
    if (v.shortA) list.forEach((x) => { if (!['dās', 'dā'].includes(x.f)) x.f = x.f.replace(/^dā/, 'da'); });
    return { conj: k, forms: list };
  }

  function perfectSystem(add, v) {
    if (v.perf && v.perf !== '-') {
      const P = v.perf.slice(0, -1);
      PERF_E.forEach((e, i) => add(P + e, 'ind', 'perf', 'act', i));
      add(P + 'ēre', 'ind', 'perf', 'act', 5);
      PPF_E.forEach((e, i) => add(P + e, 'ind', 'ppf', 'act', i));
      FUTANT_E.forEach((e, i) => add(P + e, 'ind', 'futant', 'act', i));
      SPERF_E.forEach((e, i) => add(P + e, 'cong', 'perf', 'act', i));
      SPPF_E.forEach((e, i) => add(P + e, 'cong', 'ppf', 'act', i));
      add(P + 'isse', 'inf', 'perf', 'act', null, ['v_inf']);
    }
    if (v.sup && v.sup !== '-') {
      const S = v.sup.slice(0, -2);
      if (!v.intr) participleDecl(add, S + 'us', null, 'perf');
      participleDecl(add, v.fp || S + 'ūrus', null, 'fut');
    }
  }

  function deponentForms(v) {
    const list = [];
    const base = 'v_dep';
    const add = VF(list, base);
    let [k, R] = depConjOf(v.pres, v.inf);
    if (v.mix) k = +v.mix; // orior: presente come la mista, infinito in -īrī
    const virt = R + INF_ACT[k].slice(0, -1);
    PRES_PASS[k].forEach((e, i) => add(i === 0 ? v.pres : R + e, 'ind', 'pres', 'dep', i));
    BA_PASS.forEach((e, i) => add(R + IMPF_V[k] + e, 'ind', 'impf', 'dep', i));
    FUT_PASS[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'dep', i));
    add(v.inf, 'inf', 'pres', 'dep', null);
    add(R + IMPER_P[k][0], 'imp', 'pres', 'dep', 1);
    add(R + IMPER_P[k][1], 'imp', 'pres', 'dep', 4);
    subjPass(k).forEach((e, i) => add(R + e, 'cong', 'pres', 'dep', i));
    SIMPF_PASS.forEach((e, i) => add(virt + e, 'cong', 'impf', 'dep', i));
    const [ps, pt] = PART_PRES[k];
    participleDecl(add, R + ps, R + pt, 'pres');
    participleDecl(add, v.part, null, 'perf');
    participleDecl(add, v.fp || v.part.slice(0, -2) + 'ūrus', null, 'fut');
    return { conj: k, forms: list };
  }

  function semiDepForms(v) {
    // audeō, ausus sum: presente attivo, perfetto con il participio
    const list = [];
    const add = VF(list, 'v_dep');
    const k = conjOf(v.pres, v.inf);
    const R = v.inf.slice(0, -3);
    const SI = v.inf.slice(0, -1);
    PRES_ACT[k].forEach((e, i) => add(R + e, 'ind', 'pres', 'act', i));
    BA_ACT.forEach((e, i) => add(R + IMPF_V[k] + e, 'ind', 'impf', 'act', i));
    FUT_ACT[k].forEach((e, i) => add(R + e, 'ind', 'fut', 'act', i));
    add(v.inf, 'inf', 'pres', 'act', null);
    subjAct(k).forEach((e, i) => add(R + e, 'cong', 'pres', 'act', i));
    SIMPF_ACT.forEach((e, i) => add(SI + e, 'cong', 'impf', 'act', i));
    const [ps, pt] = PART_PRES[k];
    participleDecl(add, R + ps, R + pt, 'pres');
    participleDecl(add, v.part, null, 'perf');
    return { conj: k, forms: list };
  }

  /* Verbi irregolari */
  const SUM = {
    'ind.pres': ['sum', 'es', 'est', 'sumus', 'estis', 'sunt'],
    'ind.impf': ['eram', 'erās', 'erat', 'erāmus', 'erātis', 'erant'],
    'ind.fut': ['erō', 'eris', 'erit', 'erimus', 'eritis', 'erunt'],
    'cong.pres': ['sim', 'sīs', 'sit', 'sīmus', 'sītis', 'sint'],
    'cong.impf': ['essem', 'essēs', 'esset', 'essēmus', 'essētis', 'essent'],
  };
  function irregularTable(add, T) {
    for (const key in T) {
      const [mood, tense] = key.split('.');
      const voice = key.split('.')[2] || 'act';
      T[key].forEach((f, i) => { if (f) add(f, mood, tense, voice, i); });
    }
  }
  function perfFrom(add, perf, voice = 'act') {
    const P = perf.slice(0, -1);
    PERF_E.forEach((e, i) => add(P + e, 'ind', 'perf', voice, i));
    PPF_E.forEach((e, i) => add(P + e, 'ind', 'ppf', voice, i));
    FUTANT_E.forEach((e, i) => add(P + e, 'ind', 'futant', voice, i));
    SPERF_E.forEach((e, i) => add(P + e, 'cong', 'perf', voice, i));
    SPPF_E.forEach((e, i) => add(P + e, 'cong', 'ppf', voice, i));
    add(P + 'isse', 'inf', 'perf', voice, null, ['v_inf']);
  }

  function sumForms(prefix = '', perfPre = '', base = 'v_pres', prod = false) {
    const list = [];
    const add = VF(list, base);
    const pf = (f) => {
      if (!prefix) return f;
      if (prod && /^e/.test(f)) return prefix + 'd' + f; // prōd-est
      return prefix + f;
    };
    for (const key in SUM) {
      const [mood, tense] = key.split('.');
      SUM[key].forEach((f, i) => add(pf(f), mood, tense, null, i));
    }
    add(pf('esse'), 'inf', 'pres', null, null);
    add(pf('es'), 'imp', 'pres', null, 1);
    add(pf('este'), 'imp', 'pres', null, 4);
    perfFrom(add, (prefix ? perfPre : '') + 'fuī', null);
    if (!prefix) {
      participleDecl(add, 'futūrus', null, 'fut');
      add('fore', 'inf', 'fut', null, null, ['v_inf']);
    } else if (prefix === 'ab') {
      participleDecl(add, 'absēns', 'absent', 'pres');
    } else if (prefix === 'prae') {
      participleDecl(add, 'praesēns', 'praesent', 'pres');
    }
    return list;
  }

  function possumForms() {
    const list = [];
    const add = VF(list, 'v_poss');
    for (const key in SUM) {
      const [mood, tense] = key.split('.');
      SUM[key].forEach((f, i) => add((/^s/.test(f) ? 'pos' : 'pot') + f, mood, tense, null, i));
    }
    add('posse', 'inf', 'pres', null, null);
    perfFrom(add, 'potuī', null);
    // pot + essem → possem
    return list.map((x) => ({ ...x, f: x.f.replace(/^potess/, 'poss') }));
  }

  function eoForms(prefix = '', base = 'v_irr') {
    const list = [];
    const add = VF(list, base);
    const p = (f) => prefix + f;
    const T = {
      'ind.pres': ['eō', 'īs', 'it', 'īmus', 'ītis', 'eunt'],
      'ind.impf': ['ībam', 'ībās', 'ībat', 'ībāmus', 'ībātis', 'ībant'],
      'ind.fut': ['ībō', 'ībis', 'ībit', 'ībimus', 'ībitis', 'ībunt'],
      'ind.perf': ['iī', 'īstī', 'iit', 'iimus', 'īstis', 'iērunt'],
      'ind.ppf': ['ieram', 'ierās', 'ierat', 'ierāmus', 'ierātis', 'ierant'],
      'ind.futant': ['ierō', 'ieris', 'ierit', 'ierimus', 'ieritis', 'ierint'],
      'cong.pres': ['eam', 'eās', 'eat', 'eāmus', 'eātis', 'eant'],
      'cong.impf': ['īrem', 'īrēs', 'īret', 'īrēmus', 'īrētis', 'īrent'],
      'cong.perf': ['ierim', 'ierīs', 'ierit', 'ierīmus', 'ierītis', 'ierint'],
      'cong.ppf': ['īssem', 'īssēs', 'īsset', 'īssēmus', 'īssētis', 'īssent'],
    };
    for (const key in T) {
      const [mood, tense] = key.split('.');
      T[key].forEach((f, i) => add(p(f), mood, tense, null, i));
    }
    if (!prefix) ['īvī', 'īvistī', 'īvit', 'īvimus', 'īvistis', 'īvērunt'].forEach((f, i) => add(f, 'ind', 'perf', null, i));
    add(p('īre'), 'inf', 'pres', null, null);
    add(p('īsse'), 'inf', 'perf', null, null, ['v_inf']);
    add(p('ī'), 'imp', 'pres', null, 1);
    add(p('īte'), 'imp', 'pres', null, 4);
    // participio presente iēns, euntis
    decl3Adj(p('iēns'), p('iēns'), p('iēns'), p('eunt'), true, true).forEach((x) => add(x.f, 'part', 'pres', null, null, ['v_part'], { c: x.c, n: x.n, g: x.g }));
    participleDecl(add, p('itūrus'), null, 'fut');
    return list;
  }

  function feroForms(prefix = '', perf = 'tulī', sup = 'lātum', base = 'v_irr') {
    const list = [];
    const add = VF(list, base);
    const p = (f) => prefix + f;
    const T = {
      'ind.pres': ['ferō', 'fers', 'fert', 'ferimus', 'fertis', 'ferunt'],
      'ind.impf': ['ferēbam', 'ferēbās', 'ferēbat', 'ferēbāmus', 'ferēbātis', 'ferēbant'],

      'ind.fut.pass': ['ferar', 'ferēris', 'ferētur', 'ferēmur', 'ferēminī', 'ferentur'],

  function voloForms(which) {

        'ind.fut': ['mālam', 'mālēs', 'mālet', 'mālēmus', 'mālētis', 'mālent'],

    for (const key in T) { const [mood, tense] = key.split('.'); T[key].forEach((f, i) => { if (f) add(f, mood, tense, null, i); }); }
    add({ volo: 'velle', nolo: 'nōlle', malo: 'mālle' }[which], 'inf', 'pres', null, null);

  function fioForms() {

      'ind.pres': ['fīō', 'fīs', 'fit', 'fīmus', 'fītis', 'fīunt'],

      'cong.impf': ['fierem', 'fierēs', 'fieret', 'fierēmus', 'fierētis', 'fierent'],

  /* ---------- Pronomi ---------- */
  // tabelle: [g][n] = 6 forme (nom, gen, dat, acc, voc, abl); null = manca; | separa le varianti
  const PRON = {
    is: {
      m: { s: ['is', 'eius', 'eī', 'eum', null, 'eō'], p: ['eī|iī', 'eōrum', 'eīs|iīs', 'eōs', null, 'eīs|iīs'] },
      f: { s: ['ea', 'eius', 'eī', 'eam', null, 'eā'], p: ['eae', 'eārum', 'eīs|iīs', 'eās', null, 'eīs|iīs'] },
      n: { s: ['id', 'eius', 'eī', 'id', null, 'eō'], p: ['ea', 'eōrum', 'eīs|iīs', 'ea', null, 'eīs|iīs'] },
    },
    hic: {
      m: { s: ['hic', 'huius', 'huic', 'hunc', null, 'hōc'], p: ['hī', 'hōrum', 'hīs', 'hōs', null, 'hīs'] },
      f: { s: ['haec', 'huius', 'huic', 'hanc', null, 'hāc'], p: ['hae', 'hārum', 'hīs', 'hās', null, 'hīs'] },
      n: { s: ['hoc', 'huius', 'huic', 'hoc', null, 'hōc'], p: ['haec', 'hōrum', 'hīs', 'haec', null, 'hīs'] },
    },
    idem: {
      m: { s: ['īdem', 'eiusdem', 'eīdem', 'eundem', null, 'eōdem'], p: ['eīdem|iīdem|īdem', 'eōrundem', 'eīsdem|īsdem', 'eōsdem', null, 'eīsdem|īsdem'] },
      f: { s: ['eadem', 'eiusdem', 'eīdem', 'eandem', null, 'eādem'], p: ['eaedem', 'eārundem', 'eīsdem|īsdem', 'eāsdem', null, 'eīsdem|īsdem'] },
      n: { s: ['idem', 'eiusdem', 'eīdem', 'idem', null, 'eōdem'], p: ['eadem', 'eōrundem', 'eīsdem|īsdem', 'eadem', null, 'eīsdem|īsdem'] },
    },
    qui: {
      m: { s: ['quī', 'cuius', 'cui', 'quem', null, 'quō'], p: ['quī', 'quōrum', 'quibus', 'quōs', null, 'quibus'] },
      f: { s: ['quae', 'cuius', 'cui', 'quam', null, 'quā'], p: ['quae', 'quārum', 'quibus', 'quās', null, 'quibus'] },
      n: { s: ['quod', 'cuius', 'cui', 'quod', null, 'quō'], p: ['quae', 'quōrum', 'quibus', 'quae', null, 'quibus'] },
    },
    quis: {
      m: { s: ['quis', 'cuius', 'cui', 'quem', null, 'quō'], p: ['quī', 'quōrum', 'quibus', 'quōs', null, 'quibus'] },
      n: { s: ['quid', 'cuius', 'cui', 'quid', null, 'quō'], p: ['quae', 'quōrum', 'quibus', 'quae', null, 'quibus'] },
    },
    duo: {
      m: { p: ['duo', 'duōrum', 'duōbus', 'duōs|duo', null, 'duōbus'] },
      f: { p: ['duae', 'duārum', 'duābus', 'duās', null, 'duābus'] },
      n: { p: ['duo', 'duōrum', 'duōbus', 'duo', null, 'duōbus'] },
    },
    tres: {
      m: { p: ['trēs', 'trium', 'tribus', 'trēs', null, 'tribus'] },
      f: { p: ['trēs', 'trium', 'tribus', 'trēs', null, 'tribus'] },
      n: { p: ['tria', 'trium', 'tribus', 'tria', null, 'tribus'] },
    },
    nemo: { m: { s: ['nēmō', 'nūllīus', 'nēminī', 'nēminem', null, 'nūllō'] } },
  };
  function illeTable(st, nEnd, mNom) {
    return {
      m: { s: [mNom, st + 'īus', st + 'ī', st + 'um', null, st + 'ō'], p: [st + 'ī', st + 'ōrum', st + 'īs', st + 'ōs', null, st + 'īs'] },
      f: { s: [st + 'a', st + 'īus', st + 'ī', st + 'am', null, st + 'ā'], p: [st + 'ae', st + 'ārum', st + 'īs', st + 'ās', null, st + 'īs'] },
      n: { s: [st + nEnd, st + 'īus', st + 'ī', st + nEnd, null, st + 'ō'], p: [st + 'a', st + 'ōrum', st + 'īs', st + 'a', null, st + 'īs'] },
    };
  }
  PRON.ille = illeTable('ill', 'ud', 'ille');
  PRON.iste = illeTable('ist', 'ud', 'iste');
  PRON.ipse = illeTable('ips', 'um', 'ipse');

  const PERSONAL = {
    ego: [['ego', 'nom', 's'], ['meī', 'gen', 's'], ['mihi', 'dat', 's'], ['mē', 'acc', 's'], ['mē', 'abl', 's'], ['nōs', 'nom', 'p'], ['nostrī', 'gen', 'p'], ['nostrum', 'gen', 'p'], ['nōbīs', 'dat', 'p'], ['nōs', 'acc', 'p'], ['nōbīs', 'abl', 'p'], ['mēcum', 'abl', 's', 'con me'], ['nōbīscum', 'abl', 'p', 'con noi']],
    tu: [['tū', 'nom', 's'], ['tuī', 'gen', 's'], ['tibi', 'dat', 's'], ['tē', 'acc', 's'], ['tū', 'voc', 's'], ['tē', 'abl', 's'], ['vōs', 'nom', 'p'], ['vestrī', 'gen', 'p'], ['vestrum', 'gen', 'p'], ['vōbīs', 'dat', 'p'], ['vōs', 'acc', 'p'], ['vōs', 'voc', 'p'], ['vōbīs', 'abl', 'p'], ['tēcum', 'abl', 's', 'con te'], ['vōbīscum', 'abl', 'p', 'con voi']],
    se: [['suī', 'gen', null], ['sibi', 'dat', null], ['sē', 'acc', null], ['sēsē', 'acc', null], ['sē', 'abl', null], ['sēcum', 'abl', null, 'con sé']],
  };

  function pronounForms(e) {
    const out = [];
    const key = e.lemmaKey;
    if (PERSONAL[key]) {
      PERSONAL[key].forEach(([f, c, n, note]) => out.push({ f, c, n, note }));
      return out;
    }
    const T = PRON[key];
    if (!T) return out;
    for (const g in T) for (const n in T[g]) T[g][n].forEach((cell, i) => {
      if (!cell) return;
      cell.split('|').forEach((f) => out.push({ f, c: CASES[i], n, g }));
    });
    if (key === 'qui') ['quōcum', 'quācum', 'quibuscum'].forEach((f) => out.push({ f, c: 'abl', n: f === 'quibuscum' ? 'p' : 's', g: f === 'quācum' ? 'f' : 'm', note: 'con cui' }));
    return out;
  }

  /* ---------- Lessico ---------- */
  function parseFlags(s) {
    const o = {};
    if (!s) return o;
    s.split(',').forEach((kv) => {
      kv = kv.trim();
      if (!kv) return;
      const i = kv.indexOf('=');
      if (i < 0) o[kv] = true;
      else o[kv.slice(0, i)] = kv.slice(i + 1);
    });
    return o;
  }

  const DECL_TOPIC = { 1: 'n1', 2: 'n2', 3: 'n3', 4: 'n45', 5: 'n45' };
  const DECL_NAME = { 1: '1ª declinazione', 2: '2ª declinazione', 3: '3ª declinazione', 4: '4ª declinazione', 5: '5ª declinazione' };
  const CONJ_NAME = { 1: '1ª coniugazione', 2: '2ª coniugazione', 3: '3ª coniugazione', 4: '4ª coniugazione', 5: '3ª coniugazione mista' };

  const LEX = [];
  const INDEX = new Map();
  const BY_UID = new Map();
  let idSeq = 0;

  function addIndex(form, a) {
    const k = norm(form);
    if (!INDEX.has(k)) INDEX.set(k, []);
    const arr = INDEX.get(k);
    if (!arr.some((x) => x.e === a.e && x.d === a.d)) arr.push(a);
  }

  function nounDesc(c, n, g) {
    let s = CASE_IT[c];
    if (n) s += ' ' + NUM_IT[n];
    if (g) s += ' ' + GEN_IT[g];
    return s;
  }
  function verbDesc(x, kind) {
    const dep = x.voice === 'dep';
    const v = kind === 'irr' && x.voice === 'act' ? '' : x.voice === 'act' ? ' attivo' : x.voice === 'pass' ? ' passivo' : '';
    if (x.mood === 'part') {
      const t = { pres: 'presente', perf: 'perfetto', fut: 'futuro' }[x.tense];
      return 'participio ' + t + (kind === 'dep' && x.tense === 'perf' ? ' (deponente, valore attivo)' : '') + ', ' + nounDesc(x.c, x.n, x.g);
    }
    if (x.mood === 'inf') return 'infinito ' + TENSE_IT[x.tense].replace(' semplice', '') + v + (dep ? ' (deponente)' : '');
    const moodName = { ind: 'indicativo', cong: 'congiuntivo', imp: 'imperativo' }[x.mood];
    return moodName + ' ' + TENSE_IT[x.tense] + v + (dep ? ' (deponente)' : '') + ', ' + PERS[x.p];
  }
  const verbKey = (x) => (x.mood === 'part' ? `v:part:${x.tense}:${x.c}:${x.n}:${x.g}` : x.mood === 'inf' ? `v:inf:${x.tense}:${x.voice}` : `v:${x.mood}:${x.tense}:${x.voice}:${x.p}`);
  // forma: grafia con le quantità (q) e senza (f)
  const mk = (q, rest) => Object.assign({ f: plain(q), q }, rest);

  function loadLexicon(src) {
    if (LEX.length) return;
    for (let line of src.split('\n')) {
      line = line.trim();
      if (!line || line.startsWith('#')) continue;
      const f = line.split('|').map((s) => s.trim());
      const k = f[0];
      let e;
      try {
        if (k === 'n') {
          const fl = parseFlags(f[5]);
          e = { k: 'n', nom: f[1], gen: f[2], g: f[3], it: f[4], sg: !!fl.sg, vocI: !!fl.vocI, pl: !!fl.pl, gp: fl.gp, ablI: !!fl.ablI, abus: !!fl.abus, loc: fl.loc, only: !!fl.only, drop: fl.drop ? fl.drop.split(';') : [], prop: /^[A-Z]/.test(plain(f[1])) };
          if (fl.x) e.extra = fl.x.split(';').map((s) => { const [ff, c, n] = s.split(':'); return { f: ff, c, n }; });
          const r = nounForms(e);
          e.decl = r.info.d;
          e.stems = { n: r.info.stem };
          e.t = fl.t || DECL_TOPIC[r.info.d];
          const gs = { m: 'm.', f: 'f.', n: 'n.' }[e.g];
          const shortGen = { 1: '-ae', 2: '-ī', 4: '-ūs', 5: '-eī' }[r.info.d];
          const genShow = e.pl ? e.gen : (r.info.d === 3 ? e.gen : (r.info.d === 5 && plain(e.gen).length <= 4 ? e.gen : shortGen));
          e.lemmaQ = e.nom + ', ' + genShow + ', ' + gs + (e.pl ? ' pl.' : '');
          e.cls = DECL_NAME[r.info.d];
          e.headQ = e.nom;
          e.forms = r.forms.map((x) => mk(x.f, { d: nounDesc(x.c, x.n), key: 'n:' + x.c + ':' + x.n, req: x.c === 'loc' ? [e.t, 'compl'] : [e.t], c: x.c, n: x.n }));
        } else if (k === 'a') {
          const fl = parseFlags(f[5]);
          const parts = [f[1], f[2], f[3]].filter((s) => s && s !== '-');
          e = { k: 'a', parts, it: f[4], pron: !!fl.pron, cons: !!fl.c, nocomp: !!fl.nocomp || !!fl.pron, vocMi: !!fl.mi, neutD: fl.nd };
          if (fl.x) e.extra = fl.x.split(';').map((s) => { const [ff, c, n, g] = s.split(':'); return { f: ff, c, n, g }; });
          const r = adjForms(e);
          e.adjCls = r.info.cls;
          e.stems = { a: r.info.stem };
          e.t = fl.t || (r.info.cls === 1 ? 'agg1' : 'agg2');
          if (r.info.cls === 1) e.lemmaQ = parts[0] + ', -' + parts[1].slice(r.info.stem.length) + ', -' + parts[2].slice(r.info.stem.length);
          else if (r.info.kind === 3) e.lemmaQ = parts.join(', ');
          else if (r.info.kind === 2) e.lemmaQ = parts[0] + ', -e';
          else e.lemmaQ = parts[0] + ', ' + parts[1];
          e.cls = r.info.cls === 1 ? 'aggettivo 1ª classe' : 'aggettivo 2ª classe (' + r.info.kind + (r.info.kind === 1 ? ' uscita)' : ' uscite)');

  function bRel(ctx) {

  function bCum(ctx) {

  function bUt(ctx) {
    const T = ctx.T;

    // finale con lo stesso soggetto: «per» + infinito
    if (r < 0.6 && knownU('ut')) {

  function bAbl(ctx) {

      const main = clausePlan(ctx, { lite: true, tense: mainTense, noAdv: true, noPerson: true, needObj: true, noQ: true, verbFilter: (v) => ['vinco', 'supero', 'expugno', 'capio', 'occupo', 'oppugno', 'defendo'].includes(v.la), subjFilter: (N) => N.tags.has('gent') || N.head === 'miles' || N.head === 'exercitus', ex: [lead.N.head] });

  const BY_FOCUS = {

  { id: 'n2c', title: 'I neutri in -um', sub: 'templum, templī', lemmas: ['bellum', 'donum', 'templum', 'oppidum', 'forum', 'verbum', 'consilium', 'auxilium'], keys: '^n:(nom|gen|dat|acc|abl):[sp]$', mix: NOM,
    teach: [
      { say: 'Regola d’oro dei neutri, per tutte le declinazioni: nominativo, accusativo e vocativo sono uguali, e al plurale escono in -a.' },
      { decl: ['templum'], cases: ['nom', 'gen', 'dat', 'acc', 'abl'] },
      { p: `${la('Templa')} non è un femminile della prima: è il plurale neutro di ${la('templum')}.` },
      { ex: ['Puer donum habet.', 'Il fanciullo ha un dono.'] }] },
  { id: 'n2d', title: 'Vocativo e nomi speciali', sub: 'domine, fīlī · deus', lemmas: ['filius', 'deus', 'socius', 'gladius', 'nuntius', 'legatus', 'Romani', 'Galli', 'arma', 'castra', 'praemium', 'frumentum'], mix: NOM,
    teach: [
      { say: 'Il vocativo dei nomi in -us esce in -e, anche in -ius: socie, nūntie. Fanno eccezione fīlius (fīlī) e i nomi propri latini in -ius (Vergilī). Deus ha forme tutte sue.' },
      { decl: ['dominus', 'filius'], num: 's' },
      { p: `${la('Arma, armōrum')} («armi») e ${la('castra, castrōrum')} («accampamento») si usano solo al plurale.` },
      { ex: ['Domine, servi aquam non habent.', 'Padrone, i servi non hanno acqua.'] }] },
  { id: 'n2t', title: 'Prova d’unità', sub: 'seconda declinazione', mix: TEST, test: true },
  ] },
{ id: 'agg1', title: 'Aggettivi della prima classe', say: 'Gli aggettivi concordano con il nome in genere, numero e caso, anche quando la desinenza è diversa.',
  lessons: [
  { id: 'a1a', title: 'In -us, -a, -um', sub: 'bonus, bona, bonum', lemmas: ['bonus', 'malus', 'magnus', 'parvus', 'laetus', 'novus', 'clarus', 'multus'], keys: '^a:pos:', mix: NOMA,
    teach: [
      { say: 'Maschile e neutro come la seconda declinazione, femminile come la prima.' },
      { adj: 'bonus' },
      { p: `Concordanza: ${la('agricola bonus')}, ${la('nautae bonī')}. ${la('Agricola')} è della prima, ${la('bonus')} della seconda: stesso caso, desinenze diverse.` },
      { ex: ['Puella laeta cantat.', 'La fanciulla lieta canta.'] }] },
  { id: 'a1b', title: 'In -er', sub: 'pulcher, miser, līber', lemmas: ['pulcher', 'miser', 'liber@agg1', 'aeger', 'altus', 'longus', 'iustus', 'superbus'], keys: '^a:pos:', mix: NOMA,
    teach: [
      { say: 'Come puer e ager: alcuni tengono la e, altri la perdono.' },
      { adj: 'pulcher' },
      { p: `${la('miser, misera, miserum')} tiene la e; ${la('pulcher, pulchra, pulchrum')} la perde.` },
      { ex: ['Pulchra puella in horto ambulat.', 'La bella fanciulla passeggia nel giardino.'] }] },
  { id: 'a1c', title: 'Attributo e predicato', sub: 'puella pulchra · puella pulchra est', lemmas: ['antiquus', 'Romanus', 'Graecus', 'certus', 'verus', 'tutus', 'doctus', 'validus', 'gratus'], keys: '^a:pos:', mix: NOMA,
    teach: [
      { say: 'Con sum l’aggettivo diventa predicato: puella pulchra est, «la fanciulla è bella».' },
      { tbl: { c: ['Uso', 'Esempio'], r: [['attributo', `${la('puella pulchra cantat')}, la bella fanciulla canta`], ['predicato (con sum)', `${la('puella pulchra est')}, la fanciulla è bella`], ['sostantivato', `${la('bonī')}, i buoni; ${la('multa')}, molte cose`]] } },
      { ex: ['Magna silva umbram gratam praebet.', 'La grande selva offre un’ombra gradita.'] }] },
  { id: 'a1d', title: 'Gli aggettivi pronominali', sub: 'tōtus, sōlus, nūllus, ūnus', lemmas: ['totus', 'solus', 'nullus', 'unus', 'alius', 'alter', 'primus', 'secundus'], mix: NOMA,
    teach: [
      { say: 'Sette aggettivi hanno il genitivo in -īus e il dativo in -ī, al singolare, per tutti i generi.' },
      { forms: [['totus', 'a:pos:gen:s:m', 'genitivo'], ['totus', 'a:pos:dat:s:m', 'dativo'], ['unus', 'a:pos:gen:s:f', 'genitivo'], ['alius', 'a:pos:nom:s:n', 'neutro']] },
      { ex: ['Nullus agricola laborat.', 'Nessun agricoltore lavora.'] }] },
  { id: 'a1t', title: 'Prova d’unità', sub: 'aggettivi della prima classe', mix: TESTA, test: true },
  ] },
{ id: 'v_if', title: 'Imperfetto e futuro', say: 'Andiamo nel passato e nel futuro. L’imperfetto ha il suffisso -ba-; il futuro, -bi- oppure la vocale e.',
  lessons: [
  { id: 'vif1', title: 'L’imperfetto', sub: 'amābam, monēbam, legēbam', lemmas: ['olim', 'tum', 'diu', 'nunc', 'vigilo'], keys: '^v:ind:impf:', tenses: ['pres', 'impf'], mix: VERB,
    teach: [
      { say: 'Tutte le coniugazioni hanno -ba- seguito dalle desinenze -m, -s, -t, -mus, -tis, -nt.' },
      { conj: [['amo', 'v:ind:impf:act'], ['moneo', 'v:ind:impf:act'], ['lego', 'v:ind:impf:act'], ['audio', 'v:ind:impf:act']] },
      { conj: [['sum', 'v:ind:impf:act']] },
      { ex: ['Olim nautae in insula habitabant.', 'Un tempo i marinai abitavano sull’isola.'] }] },
  { id: 'vif2', title: 'Il futuro', sub: 'amābō · legam, audiam', lemmas: ['cras', 'mox', 'iam', 'deinde'], keys: '^v:ind:(impf|fut):', tenses: ['pres', 'impf', 'fut'], mix: VERB,
    teach: [
      { say: 'Due modi di fare il futuro: -bō, -bis, -bit nella prima e nella seconda; -am, -ēs, -et nelle altre.' },
      { conj: [['amo', 'v:ind:fut:act'], ['moneo', 'v:ind:fut:act'], ['lego', 'v:ind:fut:act'], ['audio', 'v:ind:fut:act']] },
      { conj: [['sum', 'v:ind:fut:act']] },
      { p: `Nella terza la e segnala il futuro: ${la('leget')}, «leggerà»; ${la('legit')}, «legge».` },
      { ex: ['Cras magister novam fabulam narrabit.', 'Domani il maestro racconterà una nuova favola.'] }] },
  { id: 'vif3', title: 'Imperfetto o futuro?', sub: 'riconoscere i tempi', lemmas: ['oppugno', 'expugno', 'supero', 'saluto'], mix: ['analizza', 'frase', 'analizza', 'frase', 'scrivi', 'frase', 'analizza', 'frase', 'frase', 'completa'],
    teach: [
      { say: 'Monēbat o monēbit? Guarda la vocale dopo la b: a per l’imperfetto, i per il futuro.' },
      { forms: [['moneo', 'v:ind:impf:act:2', 'imperfetto'], ['moneo', 'v:ind:fut:act:2', 'futuro'], ['lego', 'v:ind:pres:act:2', 'presente'], ['lego', 'v:ind:fut:act:2', 'futuro']] },
      { ex: ['Tum Galli Romanos timebant.', 'Allora i Galli temevano i Romani.'] }] },
  { id: 'vift', title: 'Prova d’unità', sub: 'imperfetto e futuro', mix: TEST, test: true },
  ] },
{ id: 'v_poss', title: 'Possum e i composti di sum', say: 'Possum vuol dire «posso»: è sum con davanti pot-. Con l’infinito costruisci moltissime frasi.',
  lessons: [
  { id: 'vpo1', title: 'Possum al presente', sub: 'possum, potes, potest', lemmas: ['possum', 'vivo', 'valeo'], keys: '^v:(ind:pres|inf:pres):', tenses: ['pres'], mix: VERB,
    teach: [
      { say: 'Davanti a s, pot- diventa pos-: possum, possumus, possunt. Davanti a vocale resta pot-: potes, potest.' },
      { conj: [['possum', 'v:ind:pres:act']] },
      { ex: ['Hodie laborare non possum.', 'Oggi non posso lavorare.'] }] },
  { id: 'vpo2', title: 'Possum negli altri tempi', sub: 'poteram, poterō', lemmas: ['credo', 'quaero', 'invenio'], mix: VERB,
    teach: [
      { say: 'Negli altri tempi basta mettere pot- davanti alle forme di sum che conosci già.' },
      { conj: [['possum', 'v:ind:impf:act'], ['possum', 'v:ind:fut:act']] },
      { ex: ['Tum agricolae arare non poterant.', 'Allora gli agricoltori non potevano arare.'] }] },
  { id: 'vpo3', title: 'I composti di sum', sub: 'absum, adsum, dēsum, prōsum + dativo', lemmas: ['absum', 'adsum', 'desum', 'praesum', 'intersum', 'prosum', 'copiae', 'gero'], mix: SYN,
    teach: [
      { say: 'Sum con una preposizione davanti cambia significato. Quasi tutti questi verbi reggono il dativo.' },
      { lemmas: [['absum', 'a / ab + ablativo'], ['adsum', 'dativo'], ['desum', 'dativo'], ['praesum', 'dativo'], ['intersum', 'dativo'], ['prosum', 'dativo; prōd- davanti a vocale']] },
      { ex: ['Nautis pecunia deerit.', 'Ai marinai mancherà il denaro.'] }] },
  { id: 'vpot', title: 'Prova d’unità', sub: 'possum e i composti di sum', mix: TEST, test: true },
  ] },
{ id: 'v_imper', title: 'L’imperativo', say: 'Ascolta! Vieni! Con l’imperativo dai ordini, e di solito chiami la persona con il vocativo.',
  lessons: [
  { id: 'vim1', title: 'L’imperativo presente', sub: 'amā, amāte · monē, monēte', lemmas: ['vale', 'ecce'], mix: VERB,
    teach: [
      { say: 'Il singolare è il tema del verbo; il plurale aggiunge -te.' },
      { conj: [['amo', 'v:imp:pres:act'], ['moneo', 'v:imp:pres:act'], ['lego', 'v:imp:pres:act'], ['audio', 'v:imp:pres:act']] },
      { ex: ['Pueri, magistrum audite!', 'Fanciulli, ascoltate il maestro!'] }] },
  { id: 'vim2', title: 'Gli imperativi tronchi', sub: 'dīc, dūc, fac', lemmas: ['dico', 'duco', 'carpo', 'pono'], mix: VERB,
    teach: [
      { say: 'Tre verbi perdono la e finale al singolare: dīc, dūc, fac.' },
      { forms: [['dico', 'v:imp:pres:act:1', 'dīcō'], ['duco', 'v:imp:pres:act:1', 'dūcō'], ['facio', 'v:imp:pres:act:1', 'faciō'], ['capio', 'v:imp:pres:act:1', 'capiō']] },
      { ex: ['Duc equos in agrum, serve!', 'Conduci i cavalli nel campo, servo!'] }] },
  { id: 'vim3', title: 'Es, este e il vocativo', sub: 'estē bonī!', lemmas: ['o', 'aedifico', 'orno'], mix: VERB,
    teach: [
      { say: 'Anche sum ha l’imperativo: es, «sii», ed este, «siate».' },
      { forms: [['sum', 'v:imp:pres:act:1', 'singolare'], ['sum', 'v:imp:pres:act:4', 'plurale']] },
      { p: `Ricorda il vocativo: ${la('serve')}, ${la('domine')}, ${la('fīlī')}.` },
      { ex: ['Este boni, pueri!', 'Siate buoni, fanciulli!'] }] },
  { id: 'vimt', title: 'Prova d’unità', sub: 'imperativo', mix: TEST, test: true },
  ] },
{ id: 'pron_pers', title: 'Pronomi personali e possessivi', say: 'Io, tu, sé, mio, tuo: i pronomi ti fanno parlare in prima persona.',
  lessons: [
  { id: 'pp1', title: 'Ego, tū, nōs, vōs', sub: 'i pronomi personali', lemmas: ['ego', 'tu'], mix: VERB,
    teach: [
      { say: 'Il pronome soggetto si usa solo per dare enfasi: di solito basta la desinenza.' },
      { pron: 'ego' }, { pron: 'tu' },
      { ex: ['Ego te amo, tu me non amas.', 'Io ti amo, tu non mi ami.'] }] },
  { id: 'pp2', title: 'Il riflessivo', sub: 'suī, sibi, sē · suus', lemmas: ['se', 'suus'], mix: SYN,
    teach: [
      { say: 'Sē e suus si riferiscono sempre al soggetto della frase.' },
      { pron: 'se' },
      { p: `${la('Puella amīcam suam vocat')}: la fanciulla chiama la <i>sua</i> amica. ${la('Suus')} si traduce «suo» o «loro».` },
      { ex: ['Puella amicam suam vocat.', 'La fanciulla chiama la sua amica.'] }] },
  { id: 'pp3', title: 'I possessivi', sub: 'meus, tuus, noster, vester · mēcum', lemmas: ['meus', 'tuus', 'noster', 'vester', 'visito'], mix: SYN,
    teach: [
      { say: 'I possessivi si declinano come bonus. Con cum la preposizione va dopo il pronome: mēcum, tēcum.' },
      { pron: 'meus' },
      { ex: ['Venite mecum in hortum!', 'Venite con me nell’orto!'] }] },
  { id: 'ppt', title: 'Prova d’unità', sub: 'pronomi personali e possessivi', mix: TEST, test: true },
  ] },
{ id: 'v_pass', title: 'Il passivo', say: 'Il passivo dice che cosa subisce il soggetto. Le desinenze nuove sono -or, -ris, -tur, -mur, -minī, -ntur.',
  lessons: [
  { id: 'vps1', title: 'Il presente passivo', sub: 'amor, amāris, amātur', lemmas: ['vexo', 'vulnero', 'libero'], keys: '^v:(ind:pres:pass|inf:pres:pass)', tenses: ['pres'], mix: VERB,
    teach: [
      { say: 'Stesso tema del presente, desinenze passive.' },
      { conj: [['amo', 'v:ind:pres:pass'], ['lego', 'v:ind:pres:pass'], ['audio', 'v:ind:pres:pass']] },
      { p: `Chi compie l’azione, se è una persona, va con ${la('ā / ab')} + ablativo: è il complemento d’agente.` },
      { ex: ['Puellae a magistro laudantur.', 'Le fanciulle sono lodate dal maestro.'] }] },
  { id: 'vps2', title: 'Imperfetto e futuro passivi', sub: 'amābar, amābor', lemmas: ['mitto', 'relinquo', 'deleo'], keys: '^v:(ind:(pres|impf|fut):pass|inf:pres:pass)', mix: VERB,
    teach: [
      { say: 'Anche qui: suffisso dell’imperfetto o del futuro, e desinenze passive.' },
      { conj: [['amo', 'v:ind:impf:pass'], ['amo', 'v:ind:fut:pass'], ['lego', 'v:ind:fut:pass']] },
      { p: `${la('legeris')} (presente, «sei letto») e ${la('legēris')} (futuro, «sarai letto»): li distingue solo la quantità.` },
      { ex: ['Oppidum a Romanis oppugnabatur.', 'La fortezza era assediata dai Romani.'] }] },
  { id: 'vps3', title: 'Agente e causa efficiente', sub: 'ā / ab + abl. · abl. semplice', lemmas: ['terreo', 'vinco', 'punio', 'custodio'], mix: SYN,
    teach: [
      { say: 'Da chi o da che cosa? Persona: ā o ab con l’ablativo. Cosa: l’ablativo da solo.' },
      { tbl: { c: ['Complemento', 'Costruzione', 'Esempio'], r: [['agente (persona)', 'ā / ab + ablativo', `${la('ā magistrō')}, dal maestro`], ['causa efficiente (cosa)', 'ablativo semplice', `${la('sagittīs')}, dalle frecce`]] } },
      { ex: ['Sagittis multi viri vulnerabuntur.', 'Molti uomini saranno feriti dalle frecce.'] }] },
  { id: 'vpst', title: 'Prova d’unità', sub: 'il passivo', mix: TEST, test: true },
  ] },
{ id: 'n3', title: 'Terza declinazione', say: 'La terza declinazione è la più varia. Il segreto è uno solo: il tema si trova nel genitivo.',
  lessons: [
  { id: 'n3a', title: 'Gli imparisillabi', sub: 'rēx, rēgis · mīles, mīlitis', lemmas: ['rex', 'lex', 'miles', 'dux', 'homo', 'consul', 'pax', 'vox'], mix: NOMA,
    teach: [
      { say: 'Il nominativo non basta: impara sempre nominativo e genitivo. Togli -is al genitivo e trovi il tema.' },
      { decl: ['rex', 'miles'] },
      { p: `Genitivo plurale in ${la('-um')}: ${la('rēgum')}, ${la('mīlitum')}.` },
      { ex: ['Rex populo leges dat.', 'Il re dà le leggi al popolo.'] }] },
  { id: 'n3b', title: 'Parisillabi e secondo gruppo', sub: 'cīvis, cīvium · urbs, urbium', lemmas: ['civis', 'hostis', 'navis', 'urbs', 'mons', 'nox', 'mater', 'pater', 'frater', 'defendo'], mix: NOMA,
    teach: [
      { say: 'I parisillabi in -is e i nomi con due consonanti prima di -is fanno il genitivo plurale in -ium.' },
      { decl: ['civis', 'urbs'] },
      { p: `Eccezioni da ricordare: ${la('pater, māter, frāter')} fanno ${la('patrum, mātrum, frātrum')}.` },
      { ex: ['Milites urbem defendunt.', 'I soldati difendono la città.'] }] },
  { id: 'n3c', title: 'I neutri', sub: 'corpus, nōmen, mare', lemmas: ['nomen', 'corpus', 'tempus', 'flumen', 'iter', 'caput', 'carmen', 'opus', 'mare', 'animal', 'litus', 'vulnus', 'appropinquo'], mix: NOMA,
    teach: [
      { say: 'La regola dei neutri vale anche qui: nominativo e accusativo uguali, plurale in -a.' },
      { decl: ['corpus', 'mare'] },
      { p: `I neutri in ${la('-e, -al, -ar')} hanno l’ablativo in ${la('-ī')} e il plurale in ${la('-ia')}: ${la('marī, maria')}.` },
      { ex: ['Navis ad litus appropinquat.', 'La nave si avvicina alla spiaggia.'] }] },
  { id: 'n3d', title: 'Nomi astratti e di persona', sub: 'lībertās, virtūs, amor, legiō', lemmas: ['libertas', 'virtus', 'civitas', 'amor', 'timor', 'clamor', 'legio', 'oratio', 'soror', 'mulier', 'cupio'], mix: NOMA,
    teach: [
      { say: 'Molti nomi astratti sono della terza: -tās, -tūs, -or, -iō. Hanno quasi tutti il genitivo plurale in -um.' },
      { decl: ['virtus', 'legio'] },
      { ex: ['Homines pacem cupiunt.', 'Gli uomini desiderano la pace.'] }] },
  { id: 'n3t', title: 'Prova d’unità', sub: 'terza declinazione', mix: TESTA, test: true },
  ] },
{ id: 'agg2', title: 'Aggettivi della seconda classe', say: 'Gli aggettivi della seconda classe si declinano come i parisillabi della terza: ablativo in -ī, genitivo plurale in -ium.',
  lessons: [
  { id: 'a2a', title: 'Tre e due uscite', sub: 'ācer, ācris, ācre · fortis, forte', lemmas: ['acer', 'celer', 'fortis', 'omnis', 'brevis', 'tristis', 'gravis', 'facilis', 'difficilis'], keys: '^a:pos:', mix: NOMA,
    teach: [
      { say: 'Tre uscite: una per genere. Due uscite: una per maschile e femminile, una per il neutro.' },
      { adj: 'fortis' },
      { p: `${la('Omnis')} al singolare vuol dire «ogni», al plurale «tutti»: ${la('omnēs hominēs')}.` },
      { ex: ['Milites fortes urbem defendunt.', 'I soldati coraggiosi difendono la città.'] }] },
  { id: 'a2b', title: 'Una uscita', sub: 'fēlīx, fēlīcis · prūdēns', lemmas: ['felix', 'prudens', 'ingens', 'sapiens', 'potens', 'audax', 'atrox', 'dives', 'pauper'], keys: '^a:pos:', mix: NOMA,
    teach: [
      { say: 'Un’uscita sola al nominativo per tutti i generi: per riconoscerli guarda il genitivo.' },
      { adj: 'felix' },
      { ex: ['Omnes homines felices esse cupiunt.', 'Tutti gli uomini desiderano essere felici.'] }] },
  { id: 'a2c', title: 'Gli avverbi', sub: 'fortiter, ācriter, celeriter', lemmas: ['fortiter', 'acriter', 'celeriter', 'prudenter', 'facile', 'bene', 'male', 'libenter'], mix: SYN,
    teach: [
      { say: 'Dagli aggettivi della seconda classe nascono avverbi in -iter e -ter; da quelli della prima, avverbi in -ē.' },
      { tbl: { c: ['Aggettivo', 'Avverbio'], r: [[la('fortis'), la('fortiter')], [la('ācer'), la('ācriter')], [la('celer'), la('celeriter')], [la('prūdēns'), la('prūdenter')], [la('bonus'), la('bene')], [la('malus'), la('male')]] } },
      { ex: ['Milites fortiter pugnant.', 'I soldati combattono valorosamente.'] }] },
  { id: 'a2t', title: 'Prova d’unità', sub: 'aggettivi della seconda classe', mix: TESTA, test: true },
  ] },
{ id: 'v_perf', title: 'Il perfetto', say: 'Il perfetto è il tempo del racconto: «venni, vidi, vinsi». Il suo tema lo trovi nel paradigma.',
  lessons: [
  { id: 'vpf1', title: 'Il perfetto attivo', sub: 'amāvī, monuī, rēxī, lēgī', lemmas: ['heri', 'condo', 'Romulus', 'Aeneas'], keys: '^v:ind:perf:act:', tenses: ['pres', 'perf'], mix: VERB,
    teach: [
      { say: 'Le desinenze del perfetto sono uguali per tutti: -ī, -istī, -it, -imus, -istis, -ērunt.' },
      { conj: [['amo', 'v:ind:perf:act'], ['lego', 'v:ind:perf:act']] },
      { forms: [['moneo', 'v:ind:perf:act:0', 'moneō'], ['rego', 'v:ind:perf:act:0', 'regō'], ['capio', 'v:ind:perf:act:0', 'capiō'], ['do', 'v:ind:perf:act:0', 'dō']] },
      { ex: ['Romulus Romam condidit.', 'Romolo fondò Roma.'] }] },
  { id: 'vpf2', title: 'Piuccheperfetto e futuro anteriore', sub: 'amāveram, amāverō', lemmas: ['occupo', 'Hannibal', 'Carthago'], keys: '^v:ind:(perf|ppf|futant):act:', mix: VERB,
    teach: [
      { say: 'Dal tema del perfetto nascono altri due tempi: il piuccheperfetto, «avevo amato», e il futuro anteriore, «avrò amato».' },
      { conj: [['amo', 'v:ind:ppf:act'], ['amo', 'v:ind:futant:act']] },
      { ex: ['Hannibal Romanos superaverat.', 'Annibale aveva sconfitto i Romani.'] }] },
  { id: 'vpf3', title: 'Il perfetto passivo', sub: 'amātus sum · capta est', lemmas: ['interficio', 'occido'], mix: SYN,
    teach: [
      { say: 'Il perfetto passivo si forma con il participio perfetto e sum, come in italiano «è stato amato».' },
      { forms: [['amo', 'v:part:perf:nom:s:m', 'participio perfetto'], ['capio', 'v:part:perf:nom:s:f', 'femminile'], ['mitto', 'v:part:perf:nom:p:m', 'plurale']] },
      { p: `Il participio concorda con il soggetto: ${la('urbs capta est')}, «la città fu presa»; ${la('lēgātī missī sunt')}.` },
      { ex: ['Urbs a militibus capta est.', 'La città fu presa dai soldati.'] }] },

{

  body: [

  trap: ["<span class=\"la\">-es</span> è nominativo o accusativo plurale.","<span class=\"la\">corpus, tempus, opus</span> sono neutri della 3ª, non maschili della 2ª.","<span class=\"la\">pater, mater, frater, canis, iuvenis</span> fanno il genitivo plurale in <span class=\"la\">-um</span>."],
  ex: [["Rex populo leges iustas dat.","Il re dà al popolo leggi giuste."],["Canes greges ovium custodiunt.","I cani custodiscono i greggi di pecore."]],
},

{

/* ---------- Ripetizione dilazionata ---------- */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
// un solo passo avanti al giorno per parola: le risposte giuste ripetute nella stessa giornata (scheda, scelta, coppie)
// non allungano l'intervallo; un errore la riporta alla prima scatola e il recupero nello stesso giorno non la fa avanzare
function srs(uid, ok) {
  const today = dayKey();
  const v = S.vocab[uid] || { box: 0, due: today };
  if (!ok) { v.box = 1; v.due = addDays(today, BOX_DAYS[1]); v.last = today; }
  else if (v.last !== today) { v.box = Math.min(5, v.box + 1); v.due = addDays(today, BOX_DAYS[v.box]); v.last = today; }
  S.vocab[uid] = v;
}
// parole incontrate: quelle delle lezioni già superate o già fatte (anche le unità aperte scegliendo la posizione),
// con la lezione in cui ciascuna compare; le parole delle lezioni ancora da fare restano nascoste
function metWords() {
  const met = new Map();
  FLAT.forEach((f, idx) => {
    if (idx >= S.course.unlocked && !S.course.times[f.lesson.id]) return;
    for (const u of f.lesson.lemmas || []) if (ent(u) && !met.has(u)) met.set(u, f);
  });
  return met;
}
const isDue = (uid) => !!S.vocab[uid] && S.vocab[uid].due <= dayKey();
function vocabQueue() {
  const met = metWords();
  const ents = [...met.keys()].map(ent);
  const due = ents.filter((e) => isDue(e.uid));
  const fresh = ents.filter((e) => !S.vocab[e.uid]).slice(0, Math.max(0, 10 - due.length));
  return { due, fresh, all: ents, met };
}
// ripasso a esercizi: le parole di oggi (da ripassare e nuove), riconosciute nei due sensi e abbinate a coppie
function startVocabDrill() {
  const q = vocabQueue();
  const words = shuffle(q.due).concat(q.fresh).slice(0, 10);
  const items = [];
  for (const e of words) {
    const pool = q.all.filter((x) => x !== e && x.k === e.k && x.head !== e.head && shortM(x.it) !== shortM(e.it));
    if (pool.length < 2) continue;
    items.push({ type: 'lessico', uid: e.uid, reverse: Math.random() < 0.4, options: shuffle([e.uid, ...shuffle(pool).slice(0, 3).map((x) => x.uid)]), topic: e.t });
  }
  const seenM = new Set(), seenH = new Set(), pairs = [];
  for (const e of words) { const m = shortM(e.it); if (seenM.has(m) || seenH.has(e.head)) continue; seenM.add(m); seenH.add(e.head); pairs.push({ uid: e.uid, la: e.head, lq: e.headQ, it: m }); if (pairs.length >= 5) break; }
  if (pairs.length >= 3) items.splice(Math.ceil(items.length / 2), 0, { type: 'abbina', pairs, topic: words[0].t });
  if (!items.length) { toast('Per il ripasso servono almeno quattro parole incontrate.'); return; }
  begin({ kind: 'practice', mode: 'lessico', items, title: 'Ripasso del lessico', level: null, scope: scopeForPractice(sel(), S.topics[S.topics.length - 1]) });
}

const CASES = [['nom', 'Nom.'], ['gen', 'Gen.'], ['dat', 'Dat.'], ['acc', 'Acc.'], ['voc', 'Voc.'], ['abl', 'Abl.']];
const PERS_ROWS = ['1ª sing.', '2ª sing.', '3ª sing.', '1ª plur.', '2ª plur.', '3ª plur.'];
// forma con la desinenza evidenziata (il tema del lemma in tondo, la desinenza in grassetto)
function cellHtml(e, forms, kind) {
  if (!forms.length) return '—';
  return uniq(forms.map((f) => {
    const w = S.settings.quant ? f.q : f.f;
    let stem = null;

      if (kind === 'n') stem = e.stems.n; else if (kind === 'a') stem = e.stems.a;
      else if (kind === 'v') stem = /:(perf|ppf|futant):/.test(f.key) ? e.stems.perf : /^v:part:(perf|fut)/.test(f.key) ? e.stems.sup : e.stems.pres;
    }
    if (stem) { const st = S.settings.quant ? stem : E.plain(stem); if (w.startsWith(st) && w.length > st.length) return `${esc(st)}<span class="end">${esc(w.slice(st.length))}</span>`; }
    return esc(w);
  })).join(' / ');
}

const headCell = (e) => `<span class="la" lang="la">${esc(headOf(e))}</span>`;
function declTable(uids, cap, num, cases) {

  const rows = [];

    rows.push([`${lab} ${n === 's' ? 'sing.' : 'plur.'}`, ...ents.map((e) => cellHtml(e, e.forms.filter((f) => f.key === `n:${c}:${n}`), 'n'))]);
  }

const TENSE_LAB = { 'ind:pres': 'presente', 'ind:impf': 'imperfetto', 'ind:fut': 'futuro', 'ind:perf': 'perfetto', 'ind:ppf': 'piuccheperfetto', 'ind:futant': 'futuro anteriore', 'cong:pres': 'cong. presente', 'cong:impf': 'cong. imperfetto', 'cong:perf': 'cong. perfetto', 'cong:ppf': 'cong. piuccheperfetto', 'imp:pres': 'imperativo' };

    const [, m, t, v] = key.split(':');

    cols.push(sameLemma && !sameTense ? lab : sameTense ? headCell(e) : `${headCell(e)}, ${lab}`);
    data.push({ e, key });

  const title = sameTense && !sameLemma ? TENSE_LAB[specs[0][1].split(':').slice(1, 3).join(':')] + (specs[0][1].endsWith(':pass') ? ' passivo' : '') : sameLemma ? lemmaOf(data[0].e) : '';

}

/* ---------- Eventi ---------- */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  const pop = $('#pop');
  if (pop && !ev.target.closest('#pop') && !(el && el.dataset.act === 'word')) closePop();

document.addEventListener('change', (ev) => {
