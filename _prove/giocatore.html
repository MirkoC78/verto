<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove: giocatore automatico</title>
<link rel="stylesheet" href="prove.css">
</head>
<body>
<h1>Giocatore automatico</h1>
<p class="lede">Rigioca tutte le lezioni dentro un riquadro della larghezza scelta (?w=360&amp;theme=dark&amp;quant=1&amp;da=0&amp;a=107). Il risultato è in <code>frames[0].__giocatore</code> e qui sotto.</p>
<div class="frames"><div class="frame"><iframe id="f" title="Verto"></iframe></div><pre id="out">In corso…</pre></div>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.style.width = (q.get('w') || 360) + 'px';
// sempre il file appena costruito, mai una copia in cache
f.src = `../dist/verto.html?v=${Date.now()}#demo=0&theme=${q.get('theme') || 'light'}&quant=${q.get('quant') || 0}`;
f.addEventListener('load', () => {
  const w = f.contentWindow;
  const go = () => {
    if (!w.VertoApp || !w.VertoEngine.LEX.length) return setTimeout(go, 200);
    const s = w.document.createElement('script');
    s.src = '../_prove/giocatore.js?' + Date.now();
    s.onload = () => w.giocaTutto({ da: +(q.get('da') || 0), a: q.get('a') == null ? undefined : +q.get('a') }).then(() => w.controllaViste()).then(show);
    w.document.head.append(s);
  };
  const show = (R) => { document.getElementById('out').textContent = JSON.stringify({ lezioni: R.lezioni, esercizi: R.esercizi, tipi: R.tipi, errori: R.errori, console: R.console, fuori: R.fuori.slice(0, 40), accessibilita: R.a11y }, null, 1); };
  setInterval(() => { if (w.__giocatore && !w.__giocatore.fatto) show(w.__giocatore); }, 2000);
  go();
});
</script>
</body>
</html>
